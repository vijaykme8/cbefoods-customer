<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tiffin CBE" />
<meta name="theme-color" content="#8806CE" />
<title>Profile | Coimbatore Foods</title>
<link rel="manifest" id="pwa-manifest" />
<style>
@font-face{font-family:'General Sans';src:url('./fonts/GeneralSans/GeneralSans-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'General Sans';src:url('./fonts/GeneralSans/GeneralSans-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'General Sans';src:url('./fonts/GeneralSans/GeneralSans-Semibold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}

:root{
  --white:#FDFDFF;
  --black:#12130F;
  --muted:rgba(253,253,255,.50);
  --muted-strong:rgba(253,253,255,.60);
  --line:rgba(253,253,255,.12);
  --line-soft:rgba(253,253,255,.08);
  --soft:rgba(253,253,255,.12);
  --soft-deep:rgba(18,19,15,.40);
  --count-bg:rgba(253,253,255,.06);
  --cta:#08A045;
  --cta-soft:rgba(8,160,69,.12);
  --violet:#8806CE;
  --danger:#FF5A5F;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  min-height:100%;
  background:var(--black);
  color:var(--white);
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
body{
  font-family:'General Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;
  justify-content:center;
}
button,input{font:inherit}
button{border:0;background:none;padding:0;color:inherit;cursor:pointer}
button,a,[role="button"]{touch-action:manipulation}

.profile-screen{
  width:390px;
  max-width:100vw;
  min-height:100dvh;
  background:linear-gradient(0deg,rgba(253,253,255,.02),rgba(253,253,255,.02)),var(--black);
  color:var(--white);
  padding:54px 24px 96px;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.top-car{
  width:342px;
  max-width:calc(100vw - 48px);
  height:30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 auto 16px;
}
.back-button{
  height:30px;
  border-radius:14px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--white);
}
.icon-30{
  width:30px;
  height:30px;
  opacity:.5;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:var(--white);
}
.icon-30 svg{display:block}
.back-text{
  color:var(--white);
  font-size:18px;
  font-weight:500;
  line-height:27px;
  text-transform:lowercase;
}

.full-content{
  width:344px;
  max-width:calc(100vw - 48px);
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.personal-info-group{
  align-self:stretch;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:14px;
}
.persona-info{
  width:342px;
  max-width:100%;
  min-height:80px;
  padding:12px 16px;
  background:var(--soft);
  border:1px solid var(--line-soft);
  border-radius:14px;
  display:inline-flex;
  align-items:center;
  gap:16px;
}
.user-profile{
  width:56px;
  height:56px;
  position:relative;
  overflow:visible;
  flex:0 0 auto;
}
.avatar-circle{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#878887;
  color:var(--white);
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:600;
  line-height:1;
  overflow:hidden;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-edit-icon{
  width:16px;
  height:16px;
  padding:3px;
  position:absolute;
  right:0;
  top:0;
  background:var(--cta);
  border-radius:20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.name-number{
  min-width:0;
  display:inline-flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  gap:4px;
}
.profile-name{
  max-width:224px;
  color:var(--white);
  font-size:16px;
  font-weight:500;
  line-height:22.4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.profile-phone{
  color:var(--muted);
  font-size:16px;
  font-weight:500;
  line-height:22.4px;
  white-space:nowrap;
}

.input-field-group,.phone-input-field{
  align-self:stretch;
  min-height:84px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
}
.field-label{
  width:100%;
  color:var(--white);
  opacity:1;
  font-size:16px;
  font-weight:400;
  line-height:24px;
}
.field-label.muted{opacity:1}
.input-field-with-edit{
  width:100%;
  min-height:54px;
  padding:14px 20px;
  background:var(--soft);
  border:1px solid var(--line-soft);
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.input-field-with-edit.locked{
  background:var(--soft);
  gap:10px;
}
.field-value{
  min-width:0;
  flex:1 1 0;
  color:var(--white);
  font-size:18px;
  font-weight:500;
  line-height:26px;
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.number-value{
  min-width:0;
  flex:1 1 0;
  opacity:.4;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--white);
  font-size:18px;
  font-weight:500;
  line-height:26px;
  white-space:nowrap;
}
.number-value .digits{letter-spacing:.02em}
.edit-button{
  min-width:52px;
  height:20px;
  display:inline-flex;
  align-items:center;
  gap:2px;
  color:var(--cta);
  font-size:16px;
  font-weight:500;
  line-height:19.2px;
  flex:0 0 auto;
}
.edit-button svg{width:20px;height:20px;flex:0 0 auto}

.divider{
  align-self:stretch;
  height:1px;
  min-height:1px;
  background:var(--line);
}

.saved-address-section{
  align-self:stretch;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:14px;
}
.saved-add-content{
  align-self:stretch;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:14px;
}
.title-info{
  align-self:stretch;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
}
.section-title{
  align-self:stretch;
  color:var(--white);
  font-size:20px;
  font-weight:600;
  line-height:28px;
}
.section-info{
  color:var(--muted);
  font-size:14px;
  font-weight:500;
  line-height:19.6px;
}
.saved-add-group{
  align-self:stretch;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
}
.address-row{
  align-self:stretch;
  padding:6px 0;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  gap:6px;
}
.inside-wrap{
  align-self:stretch;
  min-height:40px;
  display:inline-flex;
  align-items:center;
  gap:16px;
}
.address-left-group{
  min-width:0;
  flex:1 1 0;
  display:inline-flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
}
.title-with-icon{
  max-width:100%;
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--white);
  font-size:16px;
  font-weight:500;
  line-height:20.8px;
}
.title-with-icon svg{
  width:20px;
  height:20px;
  flex:0 0 auto;
  color:var(--violet);
}
.address-title-text{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.address-line{
  align-self:stretch;
  color:var(--muted);
  font-size:14px;
  font-weight:400;
  line-height:16.8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.address-dot-button{
  width:30px;
  height:30px;
  opacity:.5;
  display:grid;
  place-items:center;
  flex:0 0 auto;
}
.address-dot-button svg{width:30px;height:30px;display:block}
.add-address-button{
  width:164px;
  min-height:44px;
  padding:12px 24px;
  background:transparent;
  border:1px solid var(--cta);
  border-radius:10px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  color:var(--cta);
  font-size:14px;
  font-weight:600;
  line-height:19.6px;
}

.past-order-section{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:10px;
  padding-bottom:22px;
}
.past-orders-title{
  align-self:stretch;
  color:var(--muted);
  font-size:14px;
  font-weight:500;
  line-height:19.6px;
}
.order-cards-group{
  align-self:stretch;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.item-card{
  align-self:stretch;
  padding:4px;
  background:var(--soft);
  border:1px solid var(--line-soft);
  box-shadow:none;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.order-header-card{
  align-self:stretch;
  min-height:57px;
  padding:12px;
  background:rgba(18,19,15,.40);
  overflow:hidden;
  border-radius:10px 10px 0 0;
  display:inline-flex;
  align-items:flex-start;
  gap:12px;
}
.order-left-content{
  flex:1 1 0;
  align-self:stretch;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.item-img{
  width:30px;
  height:30px;
  border-radius:10px;
  background:rgba(136,6,206,.16);
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:0 0 auto;
}
.item-img img{width:100%;height:100%;object-fit:cover;display:block}
.item-title{
  min-width:0;
  flex:1 1 0;
  align-self:stretch;
  display:inline-flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:flex-start;
  gap:2px;
}
.restaurant-name{
  color:var(--white);
  font-size:14px;
  font-weight:600;
  line-height:16.8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.order-id{
  color:var(--muted-strong);
  font-size:12px;
  font-weight:400;
  line-height:14.4px;
}
.order-status-delivered{
  align-self:stretch;
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.order-status-delivered .status-label{
  color:rgba(136,6,206,.80);
  font-size:12px;
  font-weight:500;
  line-height:14.4px;
  letter-spacing:.02em;
  text-align:right;
}
.status-pill{
  width:28px;
  height:28px;
  padding:6px;
  background:var(--violet);
  border-radius:40px;
  display:grid;
  place-items:center;
}
.status-pill svg{width:16px;height:16px;display:block}

.item-list{
  align-self:stretch;
  padding:0 12px;
  display:flex;
  flex-wrap:wrap;
  gap:2px 14px;
}
.item-chip{
  min-height:20px;
  display:inline-flex;
  align-items:center;
  gap:2px;
  color:var(--white);
  font-size:12px;
  font-weight:400;
  line-height:14.4px;
  max-width:100%;
}
.item-chip > span:first-child{
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
}
.item-chip .count{
  min-width:20px;
  height:20px;
  padding:4px;
  background:var(--count-bg);
  border-radius:30px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  color:var(--white);
  font-size:12px;
  font-weight:400;
  line-height:12px;
  flex:0 0 auto;
}
.cta-time-info{
  align-self:stretch;
  padding:0 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.view-details{
  align-self:stretch;
  padding:10px;
  background:var(--cta);
  color:var(--white);
  border-radius:10px;
  font-size:16px;
  font-weight:600;
  line-height:24px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.time-value{
  align-self:stretch;
  padding:10px 0;
  display:inline-flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:12px;
  font-weight:400;
  line-height:14.4px;
}
.time-value .date{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.time-value .date strong,
.time-value .total strong{
  color:var(--white);
  font-weight:500;
}
.time-value .total{
  text-align:right;
  white-space:nowrap;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.time-value .amount{
  color:var(--white);
  font-weight:500;
}

/* Latest past order card design shared for Track, now reused in Profile */
.profile-screen .track-past-order-card,
.profile-screen .track-past-order-card-v2{
  box-sizing:border-box;
  width:342px;
  max-width:100%;
  min-height:0;
  height:auto;
  padding:0;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  overflow:visible;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:10px;
}
.profile-screen .track-past-card-stack,
.profile-screen .track-past-card-main{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:10px;
  position:relative;
}
.profile-screen .track-past-top-row{
  width:100%;
  min-height:37px;
  display:inline-flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.profile-screen .track-past-order-id-pill{
  min-height:37px;
  padding:10px 20px;
  background:#FDFDFF;
  border-radius:30px;
  color:#12130F;
  font-size:14px;
  font-weight:500;
  line-height:120%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}
.profile-screen .track-past-menu-wrap{
  position:relative;
  flex:0 0 auto;
  width:34px;
  height:34px;
}
.profile-screen .track-past-menu-button{
  width:34px;
  height:34px;
  padding:0;
  border:0;
  border-radius:70px;
  background:linear-gradient(0deg, rgba(253,253,255,.20), rgba(253,253,255,.20)), #12130F;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:3.37px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.profile-screen .track-past-menu-dot{
  width:3.71px;
  height:3.71px;
  border-radius:50%;
  background:#FDFDFF;
  display:block;
  flex:0 0 auto;
}
.profile-screen .track-past-action-menu{
  position:absolute;
  right:0;
  top:40px;
  width:148px;
  padding:6px;
  border-radius:12px;
  background:#1F201C;
  border:1px solid rgba(253,253,255,.12);
  box-shadow:0 12px 30px rgba(0,0,0,.32);
  display:none;
  z-index:80;
}
.profile-screen .track-past-order-card.is-menu-open .track-past-action-menu{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.profile-screen .track-past-menu-item{
  width:100%;
  min-height:36px;
  padding:8px 10px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#FDFDFF;
  font-size:13px;
  font-weight:500;
  line-height:120%;
  text-align:left;
  cursor:pointer;
}
.profile-screen .track-past-menu-item:active,
.profile-screen .track-past-menu-item:hover{background:rgba(253,253,255,.08)}
.profile-screen .track-past-menu-item--reorder{color:#08A045}
.profile-screen .track-past-time-value{
  width:100%;
  min-height:17px;
  padding:0 10px;
  display:inline-flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.profile-screen .track-past-time{
  min-width:0;
  flex:1 1 auto;
  color:rgba(253,253,255,.60);
  font-size:14px;
  font-weight:400;
  line-height:120%;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
}
.profile-screen .track-past-total-inline{
  flex:0 0 auto;
  display:inline-flex;
  justify-content:flex-end;
  align-items:flex-start;
  gap:4px;
  white-space:nowrap;
  color:rgba(253,253,255,.50);
  font-size:14px;
  font-weight:400;
  line-height:120%;
}
.profile-screen .track-past-total-inline span{color:rgba(253,253,255,.50);font-size:14px;font-weight:400;line-height:120%}
.profile-screen .track-past-total-inline strong{color:#FDFDFF;font-size:14px;font-weight:400;line-height:120%}
.profile-screen .track-past-items-card{
  box-sizing:border-box;
  width:342px;
  max-width:100%;
  min-height:58px;
  height:auto;
  padding:8px 4px;
  background:rgba(253,253,255,.12);
  border:1px solid rgba(253,253,255,.08);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  gap:10px;
}
.profile-screen .track-past-items{
  width:100%;
  padding:0 12px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  color:#FDFDFF;
}
.profile-screen .track-past-items-row{
  width:100%;
  min-height:20px;
  display:flex;
  flex-direction:row;
  align-items:flex-start;
  justify-content:flex-start;
  gap:14px;
  flex-wrap:wrap;
}
.profile-screen .track-past-item-chip{
  min-height:20px;
  display:inline-flex;
  flex-direction:row;
  justify-content:flex-start;
  align-items:center;
  gap:2px;
  max-width:100%;
}
.profile-screen .track-past-item-name{
  max-width:none;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  color:#FDFDFF;
  font-size:12px;
  font-weight:400;
  line-height:120%;
}
.profile-screen .track-past-item-count{
  width:20px;
  min-width:20px;
  height:20px;
  padding:4px;
  background:rgba(253,253,255,.06);
  border-radius:30px;
  color:#FDFDFF;
  font-size:12px;
  font-weight:400;
  line-height:100%;
  display:inline-flex;
  justify-content:center;
  align-items:center;
}
.profile-screen .track-past-item-comma{color:#FDFDFF;font-size:12px;font-weight:500;line-height:120%}
.profile-screen .track-past-reorder-button{
  box-sizing:border-box;
  width:100%;
  min-height:37px;
  padding:10px 16px;
  background:rgba(18,19,15,.16);
  border:1px solid #08A045;
  border-radius:8px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:#08A045;
  font-size:14px;
  font-weight:500;
  line-height:120%;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* Profile past orders must use the exact same visual system as Track past orders */
.profile-screen .order-cards-group {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.profile-screen .track-past-order-card,
.profile-screen .track-past-order-card-v2 {
  box-sizing: border-box;
  width: 342px;
  max-width: 100%;
  min-height: 0;
  height: auto;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.profile-screen .track-past-card-stack,
.profile-screen .track-past-card-main {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  position: relative;
}
.profile-screen .track-past-top-row {
  width: 100%;
  min-height: 37px;
  display: inline-flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.profile-screen .track-past-order-id-pill {
  min-height: 37px;
  padding: 10px 20px;
  background: #FDFDFF;
  border-radius: 30px;
  color: #12130F;
  font-size: 14px;
  font-weight: 500;
  line-height: 120%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}
.profile-screen .track-past-menu-wrap {
  position: relative;
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
}
.profile-screen .track-past-menu-button {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 70px;
  background: linear-gradient(0deg, rgba(253,253,255,.20), rgba(253,253,255,.20)), #12130F;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3.37px;
  cursor: pointer;
}
.profile-screen .track-past-menu-dot {
  width: 3.71px;
  height: 3.71px;
  border-radius: 50%;
  background: #FDFDFF;
  display: block;
  flex: 0 0 auto;
}
.profile-screen .track-past-action-menu {
  position: absolute;
  right: 0;
  top: 40px;
  width: 148px;
  padding: 6px;
  border-radius: 12px;
  background: #1F201C;
  border: 1px solid rgba(253,253,255,.12);
  box-shadow: 0 12px 30px rgba(0,0,0,.32);
  display: none;
  z-index: 80;
}
.profile-screen .track-past-order-card.is-menu-open .track-past-action-menu {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.profile-screen .track-past-menu-item {
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #FDFDFF;
  font-size: 13px;
  font-weight: 500;
  line-height: 120%;
  text-align: left;
  cursor: pointer;
}
.profile-screen .track-past-menu-item:active,
.profile-screen .track-past-menu-item:hover {
  background: rgba(253,253,255,.08);
}
.profile-screen .track-past-menu-item--reorder {
  color: #08A045;
}
.profile-screen .track-past-time-value {
  width: 100%;
  min-height: 17px;
  padding: 0 10px;
  display: inline-flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.profile-screen .track-past-time {
  min-width: 0;
  flex: 1 1 auto;
  color: rgba(253,253,255,.60);
  font-size: 14px;
  font-weight: 400;
  line-height: 120%;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
}
.profile-screen .track-past-total-inline {
  flex: 0 0 auto;
  display: inline-flex;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 4px;
  white-space: nowrap;
}
.profile-screen .track-past-total-inline span {
  color: rgba(253,253,255,.50);
  font-size: 14px;
  font-weight: 400;
  line-height: 120%;
}
.profile-screen .track-past-total-inline strong {
  color: #FDFDFF;
  font-size: 14px;
  font-weight: 400;
  line-height: 120%;
}
.profile-screen .track-past-items-card {
  box-sizing: border-box;
  width: 342px;
  max-width: 100%;
  min-height: 58px;
  height: auto;
  padding: 8px 4px;
  background: rgba(253,253,255,.12);
  border: 1px solid rgba(253,253,255,.08);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 10px;
}
.profile-screen .track-past-items {
  width: 100%;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  color: #FDFDFF;
}
.profile-screen .track-past-items-row {
  width: 100%;
  min-height: 20px;
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}
.profile-screen .track-past-item-chip {
  min-height: 20px;
  display: inline-flex;
  flex-direction: row;
  justify-content: flex-start;
  align-items: center;
  gap: 2px;
  max-width: 100%;
}
.profile-screen .track-past-item-name {
  max-width: none;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  color: #FDFDFF;
  font-size: 12px;
  font-weight: 400;
  line-height: 120%;
}
.profile-screen .track-past-item-count {
  width: 20px;
  min-width: 20px;
  height: 20px;
  padding: 4px;
  background: rgba(253,253,255,.06);
  border-radius: 30px;
  color: #FDFDFF;
  font-size: 12px;
  font-weight: 400;
  line-height: 100%;
  display: inline-flex;
  justify-content: center;
  align-items: center;
}
.profile-screen .track-past-item-comma {
  color: #FDFDFF;
  font-size: 12px;
  font-weight: 500;
  line-height: 120%;
}
.profile-screen .track-past-reorder-button {
  box-sizing: border-box;
  width: 100%;
  min-height: 37px;
  padding: 10px 16px;
  background: rgba(8,160,69,.12);
  border: 1px solid #08A045;
  border-radius: 8px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  color: #08A045;
  font-size: 14px;
  font-weight: 500;
  line-height: 120%;
  cursor: pointer;
}

.empty-state{
  width:100%;
  padding:16px 14px;
  border:1px dashed var(--line);
  border-radius:14px;
  background:rgba(253,253,255,.04);
  color:var(--muted);
  font-size:14px;
  font-weight:500;
  line-height:19.6px;
  text-align:center;
}

.menu-popover{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding-top:92px;
  background:rgba(0,0,0,.28);
}
.menu-popover.show{display:flex}
.menu-card{
  width:min(342px,calc(100vw - 48px));
  background:#1B1C18;
  border:1px solid var(--line-soft);
  border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);
  overflow:hidden;
}
.menu-action{
  width:100%;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--white);
  font-size:15px;
  font-weight:500;
  border-bottom:1px solid var(--line-soft);
}
.menu-action:last-child{border-bottom:0}
.menu-action.danger{color:var(--danger)}

.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.42);
}
.sheet-backdrop.show{display:flex}
.sheet{
  width:min(390px,100vw);
  background:#1B1C18;
  color:var(--white);
  border-radius:24px 24px 0 0;
  padding:18px 24px 20px;
  box-shadow:0 -12px 32px rgba(0,0,0,.34);
}
.sheet-handle{
  width:44px;
  height:4px;
  border-radius:99px;
  background:rgba(253,253,255,.16);
  margin:0 auto 18px;
}
.sheet-title{
  font-size:20px;
  line-height:28px;
  font-weight:600;
  margin-bottom:14px;
}
.sheet-input{
  width:100%;
  height:54px;
  border-radius:10px;
  border:1px solid var(--line-soft);
  padding:0 16px;
  outline:none;
  background:var(--soft);
  color:var(--white);
  font-size:18px;
  font-weight:500;
}
.sheet-input::placeholder{color:rgba(253,253,255,.36)}
.sheet-input:focus{border-color:rgba(8,160,69,.7)}
.sheet-actions{display:flex;align-items:center;gap:10px;margin-top:14px}
.sheet-btn{flex:1;height:46px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:600}
.sheet-btn.cancel{border:1px solid var(--line-soft);color:var(--white)}
.sheet-btn.save{background:var(--cta);color:var(--white)}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,120px);
  z-index:80;
  width:max-content;
  max-width:min(342px,calc(100vw - 48px));
  padding:11px 14px;
  background:var(--white);
  color:var(--black);
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  line-height:18px;
  opacity:0;
  transition:transform .24s ease,opacity .24s ease;
  pointer-events:none;
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:360px){
  .profile-screen{padding-left:18px;padding-right:18px}
  .full-content,.top-car{max-width:calc(100vw - 36px)}
  .edit-button{min-width:46px;font-size:15px}
  .item-chip{font-size:11px}
}
</style>
</head>
<body>
<main class="profile-screen" aria-label="Profile screen">
  <div class="top-car">
    <button class="back-button" type="button" id="backButton" aria-label="Go back"><span class="icon-30" aria-hidden="true"><svg viewBox="0 0 30 30" width="30" height="30" fill="none"><path d="M15 27.5C8.096 27.5 2.5 21.904 2.5 15S8.096 2.5 15 2.5 27.5 8.096 27.5 15 21.904 27.5 15 27.5Z" stroke="#FDFDFF" stroke-width="1.5"/><path d="M16.58 10.59 12.18 15l4.4 4.41" stroke="#FDFDFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="back-text">back</span></button>
    <button class="icon-30" type="button" id="dotMenuButton" aria-label="Open profile options"><svg viewBox="0 0 30 30" width="30" height="30" fill="none" aria-hidden="true"><circle cx="6.8" cy="15" r="2.2" fill="#FDFDFF"/><circle cx="15" cy="15" r="2.2" fill="#FDFDFF"/><circle cx="23.2" cy="15" r="2.2" fill="#FDFDFF"/></svg></button>
  </div>

  <section class="full-content">
    <section class="personal-info-group" aria-label="Personal information">
      <div class="persona-info"><button class="user-profile" type="button" id="avatarButton" aria-label="Edit profile photo"><span class="avatar-circle" id="avatarCircle"><span id="avatarInitial">C</span></span><span class="avatar-edit-icon" aria-hidden="true"><svg viewBox="0 0 20 20" width="12" height="12" fill="none"><path d="M4.2 13.93 3.75 16.25l2.32-.45 8.94-8.94-1.87-1.87-8.94 8.94Z" fill="#FDFDFF"/><path d="M14.1 4.04 15 3.14a1.25 1.25 0 0 1 1.77 0l.09.09c.49.49.49 1.28 0 1.77l-.9.9-1.86-1.86Z" fill="#FDFDFF"/></svg></span></button><input type="file" id="avatarInput" accept="image/*" hidden /><div class="name-number"><div class="profile-name" id="profileName">Customer</div><div class="profile-phone" id="profilePhone">+91-0000000000</div></div></div>
      <div class="input-field-group"><div class="field-label muted">Name</div><div class="input-field-with-edit"><div class="field-value" id="nameFieldValue">Customer</div><button class="edit-button" type="button" id="editNameButton" aria-label="Edit name"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.12 14.92 2.5 17.5l2.58-.62 9.79-9.79-1.96-1.96-9.79 9.79Z" fill="#08A045"/><path d="m13.73 4.3.94-.94a1.57 1.57 0 0 1 2.22 0l.25.25c.61.61.61 1.61 0 2.22l-.94.94-2.47-2.47Z" fill="#08A045"/></svg><span>Edit</span></button></div></div>
      <div class="phone-input-field"><div class="field-label">Phone Number</div><div class="input-field-with-edit locked" aria-label="Phone number cannot be edited here"><div class="number-value"><span>+91</span><span class="digits" id="phoneDigits">0000000000</span></div></div></div>
    </section>
    <div class="divider" aria-hidden="true"></div>
    <section class="saved-address-section" aria-label="Saved addresses"><div class="saved-add-content"><div class="title-info"><div class="section-title">Saved Address</div><div class="section-info">Manage your default delivery address</div></div><div class="saved-add-group" id="savedAddressList"></div></div><button class="add-address-button" type="button" id="addAddressButton">+ Add address</button></section>
    <div class="divider" aria-hidden="true"></div>
    <section class="past-order-section" aria-label="Past orders"><div class="past-orders-title">Past orders</div><div class="order-cards-group" id="pastOrdersList"></div></section>
  </section>
</main>
<div class="menu-popover" id="menuPopover" aria-hidden="true"><div class="menu-card" role="menu" aria-label="Profile menu"><button class="menu-action" type="button" id="refreshProfileButton">Refresh profile data <span>↻</span></button><button class="menu-action" type="button" id="goOrdersButton">Go to orders <span>›</span></button><button class="menu-action danger" type="button" id="logoutButton">Logout <span>›</span></button></div></div>
<div class="sheet-backdrop" id="nameSheet" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nameSheetTitle"><div class="sheet-handle"></div><div class="sheet-title" id="nameSheetTitle">Edit name</div><input class="sheet-input" id="nameInput" type="text" maxlength="40" autocomplete="name" placeholder="Enter your name" /><div class="sheet-actions"><button class="sheet-btn cancel" type="button" id="cancelNameButton">Cancel</button><button class="sheet-btn save" type="button" id="saveNameButton">Save</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const PROFILE_KEYS=['TIFFIN_CUSTOMER_PROFILE','CBE_CUSTOMER_PROFILE','customerProfile','cust_profile','userProfile','profile'];
const SAVED_ADDRESS_LIST_KEYS=['cust_saved_addresses','delivery_saved_addresses','TIFFIN_SAVED_ADDRESSES','tiffin_saved_addresses','CBE_SAVED_ADDRESSES','cbe_saved_addresses','savedAddresses','saved_addresses','savedDeliveryAddresses','delivery_addresses','TIFFIN_CUSTOMER_ADDRESSES'];
const ACTIVE_LOCATION_KEYS=['cust_location_details','delivery_location_details','activeDeliveryLocation','customer_active_delivery_location','cust_location','delivery_location','customer_location','user_location','userLocation','deliveryLocation','current_location','currentLocation','geo_location','geoLocation','location','TIFFIN_ACTIVE_DELIVERY_LOCATION','activeDeliveryLocation','selectedDeliveryAddress','currentDeliveryAddress','TIFFIN_SELECTED_ADDRESS','cbe_active_delivery_location','active_delivery_location'];
const TEXT_FALLBACK_KEYS=['cust_address','customer_address','delivery_address','deliveryAddress','cust_full_address','delivery_full_address','selected_address','selectedAddress','user_address','address','cust_location_name','cust_location_address','current_address','currentAddress'];
const ORDER_KEYS=['order_history','current_order','TIFFIN_ORDERS','TIFFIN_CUSTOMER_ORDERS','customerOrders','orders','cbeOrders','pastOrders','TIFFIN_ORDER_HISTORY'];
const $=s=>document.querySelector(s);const els={profileName:$('#profileName'),profilePhone:$('#profilePhone'),nameFieldValue:$('#nameFieldValue'),phoneDigits:$('#phoneDigits'),avatarCircle:$('#avatarCircle'),avatarButton:$('#avatarButton'),avatarInput:$('#avatarInput'),savedAddressList:$('#savedAddressList'),pastOrdersList:$('#pastOrdersList'),nameSheet:$('#nameSheet'),nameInput:$('#nameInput'),toast:$('#toast'),menuPopover:$('#menuPopover')};
let profile=loadProfile();
document.addEventListener('DOMContentLoaded',init);
function init(){renderAll();bindEvents()}
function bindEvents(){
 $('#backButton').addEventListener('click',goBack);$('#editNameButton').addEventListener('click',openNameSheet);$('#cancelNameButton').addEventListener('click',closeNameSheet);$('#saveNameButton').addEventListener('click',saveName);els.nameSheet.addEventListener('click',e=>{if(e.target===els.nameSheet)closeNameSheet()});els.nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')saveName();if(e.key==='Escape')closeNameSheet()});
 els.avatarButton.addEventListener('click',()=>els.avatarInput.click());els.avatarInput.addEventListener('change',saveAvatar);
 $('#addAddressButton').addEventListener('click',()=>{sessionStorage.setItem('cbe_location_return_to','profile');sessionStorage.setItem('cbe_open_location_map','1');location.href='menu.html?openLocation=1&returnTo=profile&profileAction=addAddress'});
 $('#dotMenuButton').addEventListener('click',toggleMenu);els.menuPopover.addEventListener('click',e=>{if(e.target===els.menuPopover)closeMenu()});$('#refreshProfileButton').addEventListener('click',()=>{closeMenu();refreshFromStorage();showToast('Profile refreshed')});$('#goOrdersButton').addEventListener('click',()=>{location.href='track-fullscreen.html'});$('#logoutButton').addEventListener('click',logout);
 window.addEventListener('pageshow',refreshFromStorage);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshFromStorage()});document.addEventListener('click',e=>{if(!e.target.closest('.track-past-menu-wrap'))closeProfilePastOrderMenus()});
}
function refreshFromStorage(){profile=loadProfile();renderAll()}window.CBEProfileRefresh=refreshFromStorage;window.renderOrders=renderPastOrders;function renderAll(){renderProfile();renderAddresses();renderPastOrders()}
function renderProfile(){const name=cleanText(profile.name)||'Customer';const phone=normalizePhone(profile.phone||profile.mobile||profile.number||'');const digits=phone.digits||'0000000000';const displayPhone=phone.display||'+91-0000000000';els.profileName.textContent=name;els.nameFieldValue.textContent=name;els.profilePhone.textContent=displayPhone;els.phoneDigits.textContent=digits;if(profile.avatarDataUrl){els.avatarCircle.innerHTML='<img alt="Profile photo" src="'+escapeAttribute(profile.avatarDataUrl)+'" />'}else{els.avatarCircle.innerHTML='<span id="avatarInitial">'+escapeHtml(getInitial(name))+'</span>'}}
function renderAddresses(){const addresses=getSavedAddresses();els.savedAddressList.innerHTML='';if(!addresses.length){els.savedAddressList.innerHTML='<div class="empty-state">No saved address yet. Add one from the map flow.</div>';return}addresses.slice(0,6).forEach((address,index)=>{const row=document.createElement('div');row.className='address-row';row.innerHTML=`<div class="inside-wrap"><div class="address-left-group"><div class="title-with-icon">${getAddressIcon(address.type||address.title||'')}<span class="address-title-text">${escapeHtml(address.title||address.type||'Saved address')}</span></div><div class="address-line">${escapeHtml(address.line||'Address details not available')}</div></div><button class="edit-button" type="button" data-address-index="${index}" aria-label="Edit ${escapeAttribute(address.title||'address')}">${editIconSvg()}<span>Edit</span></button><button class="address-dot-button" type="button" aria-label="More options for ${escapeAttribute(address.title||'address')}">${dotMenuSvg()}</button></div>`;row.querySelector('.edit-button').addEventListener('click',()=>{localStorage.setItem('TIFFIN_PROFILE_EDIT_ADDRESS_ID',address.id||'');localStorage.setItem('TIFFIN_PROFILE_EDIT_ADDRESS_INDEX',String(index));sessionStorage.setItem('cbe_location_return_to','profile');sessionStorage.setItem('cbe_open_location_map','1');location.href='menu.html?openLocation=1&returnTo=profile&profileAction=editAddress&addressIndex='+encodeURIComponent(index)});els.savedAddressList.appendChild(row);if(index<Math.min(addresses.length,6)-1){const div=document.createElement('div');div.className='divider';els.savedAddressList.appendChild(div)}})}
function renderPastOrders(){
 const orders=getPastOrders();
 els.pastOrdersList.innerHTML='';
 if(!orders.length){els.pastOrdersList.innerHTML='<div class="empty-state">No past orders yet. Completed orders will appear here.</div>';return}
 orders.slice(0,8).forEach(order=>{els.pastOrdersList.appendChild(buildProfilePastOrderCard(order))})
}
function buildProfilePastOrderCard(order){
 const id=cleanText(order.id)||'----';
 const safeId=escapeAttribute(id);
 const displayId=escapeHtml(String(id).replace(/^CBE-/i,''));
 const total='₹'+escapeHtml(formatMoney(order.total||order.totalPaid||order.amount||0));
 const placed=escapeHtml(formatOrderDate(order.createdAt||order.date||order.timestamp));
 const card=document.createElement('article');
 card.className='track-past-order-card track-past-order-card-v2';
 card.setAttribute('data-profile-past-order-card',id);
 card.innerHTML=`
  <div class="track-past-card-stack">
    <div class="track-past-card-main">
      <div class="track-past-top-row">
        <div class="track-past-order-id-pill">Order ID #${displayId}</div>
        <div class="track-past-menu-wrap">
          <button class="track-past-menu-button" type="button" aria-label="Order actions" data-profile-past-menu="${safeId}">
            <span class="track-past-menu-dot"></span>
            <span class="track-past-menu-dot"></span>
            <span class="track-past-menu-dot"></span>
          </button>
          <div class="track-past-action-menu" role="menu">
            <button class="track-past-menu-item" type="button" role="menuitem" data-profile-past-details="${safeId}">View details</button>
            <button class="track-past-menu-item track-past-menu-item--reorder" type="button" role="menuitem" data-profile-past-reorder="${safeId}">Reorder this</button>
          </div>
        </div>
      </div>
      <div class="track-past-time-value">
        <div class="track-past-time">${placed}</div>
        <div class="track-past-total-inline"><span>Total value:</span><strong>${total}</strong></div>
      </div>
      <div class="track-past-items-card">
        <div class="track-past-items">${buildProfilePastOrderItems(order.items)}</div>
        <button class="track-past-reorder-button" type="button" data-profile-past-reorder="${safeId}">Reorder this</button>
      </div>
    </div>
  </div>`;
 card.querySelector('[data-profile-past-menu]').addEventListener('click',event=>{event.stopPropagation();const open=card.classList.contains('is-menu-open');closeProfilePastOrderMenus();if(!open)card.classList.add('is-menu-open')});
 card.querySelectorAll('[data-profile-past-details]').forEach(btn=>btn.addEventListener('click',event=>{event.stopPropagation();openPastOrderDetails(order)}));
 card.querySelectorAll('[data-profile-past-reorder]').forEach(btn=>btn.addEventListener('click',event=>{event.stopPropagation();reorderPastOrder(order)}));
 return card;
}
function buildProfilePastOrderItems(items){
 const list=Array.isArray(items)&&items.length?items:[{name:'Order item',qty:1}];
 const chips=list.slice(0,10).map((item,index)=>`<div class="track-past-item-chip"><span class="track-past-item-name">${escapeHtml(item.name||item.title||item.itemName||item.productName||'Item')}</span><span class="track-past-item-count">${escapeHtml(item.qty||item.quantity||item.count||1)}</span>${index<Math.min(list.length,10)-1?'<span class="track-past-item-comma">,</span>':''}</div>`);
 const rows=[];for(let i=0;i<chips.length;i+=2){rows.push(`<div class="track-past-items-row">${chips.slice(i,i+2).join('')}</div>`)}return rows.join('')
}
function closeProfilePastOrderMenus(){document.querySelectorAll('.track-past-order-card.is-menu-open').forEach(card=>card.classList.remove('is-menu-open'))}

<script>
(function installCBEProfileCustomerStore() {
  /*
    Profile customer memory bridge
    ----------------------------------------
    Reads/writes the same customer memory as menu.html:
    customers/{uid or phone_id}
      savedAddresses
      activeDeliveryLocation
      profile/name/avatar
      currentCart

    UI-safe rules:
    - no layout changes
    - no unpaid order creation
    - localStorage remains only the fast cache
  */

  const CUSTOMER_ID_KEY = "cbe_active_customer_id";
  const CACHE_VERSION_KEY = "cbe_customer_cache_version";
  const CACHE_VERSION = "customer-memory-v1";
  const SYNC_DELAY_MS = 700;

  const PHONE_KEYS = [
    "customer_phone",
    "cust_phone",
    "cbe_customer_phone",
    "tiffin_customer_phone",
    "TIFFIN_CUSTOMER_PHONE",
    "loggedInPhone",
    "logged_in_phone",
    "phoneNumber",
    "phone_number",
    "mobile",
    "user_phone"
  ];

  let db = null;
  let currentIdentity = null;
  let syncTimer = 0;
  let restoring = false;
  let lastSnapshot = "";

  function clean(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  function parseJSON(value, fallback = null) {
    if (!value) return fallback;
    if (typeof value !== "string") return value;
    try { return JSON.parse(value); } catch (_) { return fallback; }
  }

  function stringify(value) {
    try { return JSON.stringify(value); } catch (_) { return ""; }
  }

  function phoneId(phone) {
    const digits = clean(phone).replace(/\D/g, "");
    return digits ? `phone_${digits}` : "";
  }

  function readPhoneFromLocal() {
    for (const key of PHONE_KEYS) {
      const value = clean(localStorage.getItem(key));
      if (value) return value;
    }

    const authUser = parseJSON(localStorage.getItem("cust_auth_user"), null);
    if (authUser && typeof authUser === "object") {
      return clean(authUser.phoneNumber || authUser.phone || authUser.mobile);
    }

    return "";
  }

  function getAuthUser() {
    try {
      if (!window.firebase || !firebase.auth) return null;
      return firebase.auth().currentUser || null;
    } catch (_) {
      return null;
    }
  }

  function getIdentity() {
    const user = getAuthUser();
    const uid = clean(user?.uid || localStorage.getItem("cust_uid") || localStorage.getItem("customer_uid"));
    const phoneNumber = clean(user?.phoneNumber) || readPhoneFromLocal();
    const customerId = uid || phoneId(phoneNumber);

    if (!customerId) return null;

    return {
      customerId,
      uid,
      phoneNumber,
      source: uid ? "firebase_auth_uid" : "phone_local_storage"
    };
  }

  function getDb() {
    if (db) return db;
    try {
      if (!window.firebase || !firebase.firestore) return null;
      db = firebase.firestore();
      return db;
    } catch (error) {
      console.warn("Profile customer memory Firestore unavailable", error);
      return null;
    }
  }

  function getCustomerRef(identity = currentIdentity) {
    const firestore = getDb();
    if (!firestore || !identity || !identity.customerId) return null;
    return firestore.collection("customers").doc(identity.customerId);
  }

  function readSavedAddresses() {
    const keys = [
      "cust_saved_addresses",
      "delivery_saved_addresses",
      "savedAddresses",
      "TIFFIN_SAVED_ADDRESSES",
      "CBE_SAVED_ADDRESSES"
    ];

    for (const key of keys) {
      const parsed = parseJSON(localStorage.getItem(key), null);
      if (Array.isArray(parsed)) return parsed.filter(Boolean);
    }

    return [];
  }

  function writeSavedAddresses(addresses) {
    const safeList = Array.isArray(addresses) ? addresses.filter(Boolean) : [];
    const raw = stringify(safeList);
    if (!raw) return;

    localStorage.setItem("cust_saved_addresses", raw);
    localStorage.setItem("delivery_saved_addresses", raw);
    localStorage.setItem("savedAddresses", raw);
  }

  function readActiveLocation() {
    const keys = [
      "activeDeliveryLocation",
      "customer_active_delivery_location",
      "cust_location_details",
      "delivery_location_details",
      "cust_location",
      "delivery_location"
    ];

    for (const key of keys) {
      const parsed = parseJSON(localStorage.getItem(key), null);
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
    }

    return null;
  }

  function writeActiveLocation(location) {
    if (!location || typeof location !== "object") return;

    const raw = stringify(location);
    if (!raw) return;

    localStorage.setItem("activeDeliveryLocation", raw);
    localStorage.setItem("customer_active_delivery_location", raw);
    localStorage.setItem("cust_location_details", raw);
    localStorage.setItem("delivery_location_details", raw);

    const shortAddress = clean(location.displayAddress || location.display || localStorage.getItem("cust_address"));
    const fullAddress = clean(location.fullAddress || location.full || location.address || localStorage.getItem("cust_full_address"));

    if (shortAddress) {
      localStorage.setItem("cust_address", shortAddress);
      localStorage.setItem("delivery_address", shortAddress);
    }

    if (fullAddress) {
      localStorage.setItem("cust_full_address", fullAddress);
      localStorage.setItem("delivery_full_address", fullAddress);
    }

    if (location.lat && location.lng) {
      localStorage.setItem("cust_location", raw);
      localStorage.setItem("cust_lat", String(location.lat));
      localStorage.setItem("cust_lng", String(location.lng));
    }
  }

  function readProfile() {
    const saved = parseJSON(localStorage.getItem("TIFFIN_CUSTOMER_PROFILE"), null) ||
      parseJSON(localStorage.getItem("customerProfile"), null) ||
      {};

    return {
      ...(saved && typeof saved === "object" ? saved : {}),
      name: clean(saved?.name || localStorage.getItem("TIFFIN_CUSTOMER_NAME") || localStorage.getItem("customer_name")),
      phone: clean(saved?.phone || saved?.phoneNumber || currentIdentity?.phoneNumber || readPhoneFromLocal()),
      avatarDataUrl: clean(saved?.avatarDataUrl || saved?.avatar || saved?.profilePhoto)
    };
  }

  function writeProfile(profile) {
    if (!profile || typeof profile !== "object") return;

    const previous = readProfile();
    const next = {
      ...previous,
      ...profile,
      name: clean(profile.name || profile.displayName || profile.profileName || previous.name || "Customer"),
      phone: clean(profile.phone || profile.phoneNumber || currentIdentity?.phoneNumber || previous.phone),
      avatarDataUrl: clean(profile.avatarDataUrl || profile.avatar || profile.profilePhoto || previous.avatarDataUrl)
    };

    localStorage.setItem("TIFFIN_CUSTOMER_PROFILE", stringify(next));
    localStorage.setItem("customerProfile", stringify(next));

    if (next.name) {
      localStorage.setItem("TIFFIN_CUSTOMER_NAME", next.name);
      localStorage.setItem("customer_name", next.name);
    }

    if (next.phone) {
      localStorage.setItem("TIFFIN_CUSTOMER_PHONE", next.phone);
      localStorage.setItem("customer_phone", next.phone);
      localStorage.setItem("cust_phone", next.phone);
    }
  }

  function readCartItems() {
    const value = parseJSON(localStorage.getItem("cart"), []);
    if (Array.isArray(value)) return value.filter(item => item && Number(item.qty || item.quantity || 0) > 0);
    if (value && typeof value === "object") return Object.values(value).filter(item => item && Number(item.qty || item.quantity || 0) > 0);
    return [];
  }

  function writeCartItems(items) {
    if (!Array.isArray(items)) return;
    localStorage.setItem("cart", stringify(items.filter(item => item && Number(item.qty || item.quantity || 0) > 0)));
  }

  function addressKey(address) {
    if (!address || typeof address !== "object") return "";
    return [
      clean(address.id),
      clean(address.label || address.title || address.type),
      clean(address.fullAddress || address.full || address.displayAddress || address.display || address.addressDetails || address.address),
      clean(address.doorNo),
      clean(address.lat),
      clean(address.lng)
    ].join("|").toLowerCase();
  }

  function mergeAddresses(localList, remoteList) {
    const merged = [];
    const seen = new Set();

    [localList, remoteList].forEach(list => {
      if (!Array.isArray(list)) return;
      list.filter(Boolean).forEach(address => {
        const key = addressKey(address);
        const idKey = clean(address?.id).toLowerCase();
        if ((key && seen.has(key)) || (idKey && seen.has(`id:${idKey}`))) return;
        if (key) seen.add(key);
        if (idKey) seen.add(`id:${idKey}`);
        merged.push(address);
      });
    });

    return merged;
  }

  function refreshProfileUI() {
    try {
      if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
    } catch (_) {}
  }

  function clearPreviousCustomerCache() {
    [
      "cust_saved_addresses",
      "delivery_saved_addresses",
      "savedAddresses",
      "activeDeliveryLocation",
      "customer_active_delivery_location",
      "cust_location_details",
      "delivery_location_details",
      "cust_address",
      "delivery_address",
      "cust_full_address",
      "delivery_full_address",
      "cust_location",
      "cust_lat",
      "cust_lng",
      "cart"
    ].forEach(key => {
      try { localStorage.removeItem(key); } catch (_) {}
    });
  }

  function buildPayload(reason = "sync") {
    const now = new Date().toISOString();
    const profile = readProfile();

    return {
      uid: currentIdentity?.uid || "",
      phoneNumber: currentIdentity?.phoneNumber || profile.phone || "",
      customerId: currentIdentity?.customerId || "",
      identitySource: currentIdentity?.source || "",
      app: "coimbatore-foods-customer-pwa",
      sourcePage: "profile.html",
      syncReason: reason,

      name: profile.name || "Customer",
      profile: {
        name: profile.name || "Customer",
        phone: profile.phone || currentIdentity?.phoneNumber || "",
        avatarDataUrl: profile.avatarDataUrl || "",
        updatedAt: now
      },

      savedAddresses: readSavedAddresses(),
      activeDeliveryLocation: readActiveLocation(),
      currentCart: {
        items: readCartItems(),
        updatedAt: now
      },

      cacheVersion: CACHE_VERSION,
      updatedAt: now,
      lastSeenAt: now
    };
  }

  async function restoreFromFirebase(identity) {
    const ref = getCustomerRef(identity);
    if (!ref) return;

    restoring = true;

    try {
      const previousCustomerId = clean(localStorage.getItem(CUSTOMER_ID_KEY));
      const isDifferentCustomer = previousCustomerId && previousCustomerId !== identity.customerId;

      if (isDifferentCustomer) clearPreviousCustomerCache();

      localStorage.setItem(CUSTOMER_ID_KEY, identity.customerId);
      localStorage.setItem(CACHE_VERSION_KEY, CACHE_VERSION);

      const snapshot = await ref.get();
      const remote = snapshot.exists ? (snapshot.data() || {}) : {};

      const remoteProfile = remote.profile && typeof remote.profile === "object" ? remote.profile : {};
      const remoteName = clean(remoteProfile.name || remote.name || remote.displayName);
      const remoteAvatar = clean(remoteProfile.avatarDataUrl || remote.avatarDataUrl || remote.avatar || remote.profilePhoto);

      if (remoteName || remoteAvatar || identity.phoneNumber) {
        writeProfile({
          name: remoteName || undefined,
          phone: identity.phoneNumber || remoteProfile.phone || remote.phoneNumber,
          avatarDataUrl: remoteAvatar || undefined
        });
      }

      const localAddresses = readSavedAddresses();
      const remoteAddresses = Array.isArray(remote.savedAddresses) ? remote.savedAddresses.filter(Boolean) : [];
      const mergedAddresses = isDifferentCustomer ? remoteAddresses : mergeAddresses(localAddresses, remoteAddresses);
      if (mergedAddresses.length) writeSavedAddresses(mergedAddresses);

      const localActiveLocation = readActiveLocation();
      const remoteActiveLocation = remote.activeDeliveryLocation && typeof remote.activeDeliveryLocation === "object"
        ? remote.activeDeliveryLocation
        : null;
      if ((!localActiveLocation || isDifferentCustomer) && remoteActiveLocation) writeActiveLocation(remoteActiveLocation);

      const localCart = readCartItems();
      const remoteCart = Array.isArray(remote.currentCart?.items) ? remote.currentCart.items.filter(Boolean) : [];
      if ((!localCart.length || isDifferentCustomer) && remoteCart.length) writeCartItems(remoteCart);

      currentIdentity = identity;
      refreshProfileUI();
      await syncNow("profile_restore");
    } catch (error) {
      console.warn("Profile customer memory restore skipped", error);
      refreshProfileUI();
    } finally {
      restoring = false;
    }
  }

  async function syncNow(reason = "manual") {
    if (restoring) return;
    currentIdentity = getIdentity() || currentIdentity;
    const ref = getCustomerRef(currentIdentity);
    if (!ref) return;

    const payload = buildPayload(reason);
    const snapshot = stringify(payload);
    if (snapshot && snapshot === lastSnapshot) return;

    try {
      await ref.set(payload, { merge: true });
      lastSnapshot = snapshot;
    } catch (error) {
      console.warn("Profile customer memory sync skipped", error);
    }
  }

  function scheduleSync(reason = "local_change") {
    if (restoring) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(reason), SYNC_DELAY_MS);
  }

  function boot() {
    currentIdentity = getIdentity();
    if (!currentIdentity) {
      window.CBEProfileCustomerStore.status = "waiting_for_customer_identity";
      refreshProfileUI();
      return;
    }

    window.CBEProfileCustomerStore.status = "ready";
    window.CBEProfileCustomerStore.identity = currentIdentity;
    restoreFromFirebase(currentIdentity);
  }

  function bootWhenAuthReady() {
    try {
      if (window.firebase && firebase.auth && typeof firebase.auth().onAuthStateChanged === "function") {
        let didBoot = false;
        firebase.auth().onAuthStateChanged(() => {
          if (didBoot) return;
          didBoot = true;
          boot();
        });

        setTimeout(() => {
          if (didBoot) return;
          didBoot = true;
          boot();
        }, 1200);
        return;
      }
    } catch (_) {}

    boot();
  }

  window.CBEProfileCustomerStore = {
    status: "booting",
    identity: null,
    scheduleSync,
    syncNow,
    restore: boot,
    readLocal: () => buildPayload("read_local")
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootWhenAuthReady, { once: true });
  else bootWhenAuthReady();

  window.addEventListener("pagehide", () => syncNow("pagehide"));
})();
</script>

<script>
(function syncProfilePastOrdersFromFirestore() {
  function clean(value) { return value === null || value === undefined ? "" : String(value).trim(); }
  function parseJSON(value, fallback) { try { return JSON.parse(value); } catch (_) { return fallback; } }
  function phone10(value) {
    const digits = clean(value).replace(/\D/g, "");
    return digits.length > 10 ? digits.slice(-10) : digits;
  }
  function timestampToISO(value) {
    if (!value) return "";
    if (typeof value.toDate === "function") return value.toDate().toISOString();
    if (value.seconds) return new Date(value.seconds * 1000).toISOString();
    if (typeof value === "string") return value;
    return "";
  }
  function normalizeOrder(id, data) {
    if (!data) return null;
    return {
      id,
      ...data,
      createdAt: timestampToISO(data.createdAt) || data.createdAtClient || data.createdAt || "",
      updatedAt: timestampToISO(data.updatedAt) || data.updatedAt || "",
      deliveredAt: timestampToISO(data.deliveredAt) || data.deliveredAt || "",
      items: Array.isArray(data.items) ? data.items : [],
      total: Number(data.totals?.total ?? data.total ?? data.totalPaid ?? data.amount ?? 0),
      restaurantName: data.restaurantName || data.storeName || "Coimbatore Foods"
    };
  }
  function saveAndRefresh(orders) {
    try {
      localStorage.setItem("order_history", JSON.stringify(orders));
      localStorage.setItem("TIFFIN_ORDER_HISTORY", JSON.stringify(orders));
    } catch (_) {}
    if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
    else if (typeof window.renderOrders === "function") window.renderOrders();
  }
  function boot() {
    if (!window.firebase || !window.TIFFIN_FIREBASE_CONFIG || !window.TIFFIN_FIREBASE_CONFIG.apiKey) {
      if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(window.TIFFIN_FIREBASE_CONFIG);
      const auth = firebase.auth();
      const db = firebase.firestore();
      auth.onAuthStateChanged(user => {
        const localUid = clean(localStorage.getItem("cust_uid"));
        const customerId = clean(user?.uid || localUid);
        const customerPhone = phone10(user?.phoneNumber || localStorage.getItem("cust_phone") || localStorage.getItem("customer_phone") || "");
        if (!customerId && !customerPhone) {
          if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
          return;
        }
        let latestByUid = [];
        let latestByPhone = [];
        function mergeAndRender() {
          const map = new Map();
          [...latestByPhone, ...latestByUid].forEach(order => {
            if (!order || !order.id) return;
            map.set(order.id, order);
          });
          const orders = Array.from(map.values()).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          saveAndRefresh(orders);
        }
        if (customerId) {
          db.collection("orders")
            .where("customerId", "==", customerId)
            .orderBy("createdAt", "desc")
            .limit(30)
            .onSnapshot(snapshot => {
              latestByUid = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data())).filter(Boolean);
              mergeAndRender();
            }, error => console.warn("Profile order history UID sync failed", error));
        }
        if (customerPhone) {
          db.collection("orders")
            .where("customerPhone", "==", customerPhone)
            .orderBy("createdAt", "desc")
            .limit(30)
            .onSnapshot(snapshot => {
              latestByPhone = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data())).filter(Boolean);
              mergeAndRender();
            }, error => console.warn("Profile order history phone sync failed", error));
        }
      });
    } catch (error) {
      console.warn("Profile order history sync failed", error);
      if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, { once: true });
  else boot();
})();
</script>


<script>
(function preventMobileDoubleTapZoom(){
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(event){
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('gesturestart', function(event){
    event.preventDefault();
  }, { passive: false });
})();
</script>
