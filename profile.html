<script>
(function(){
'use strict';
const PROFILE_KEYS=['TIFFIN_CUSTOMER_PROFILE','CBE_CUSTOMER_PROFILE','customerProfile','cust_profile','userProfile','profile'];
const SAVED_ADDRESS_LIST_KEYS=['cust_saved_addresses','delivery_saved_addresses','TIFFIN_SAVED_ADDRESSES','tiffin_saved_addresses','CBE_SAVED_ADDRESSES','cbe_saved_addresses','savedAddresses','saved_addresses','savedDeliveryAddresses','delivery_addresses','TIFFIN_CUSTOMER_ADDRESSES'];

const TEXT_FALLBACK_KEYS=['cust_address','customer_address','delivery_address','deliveryAddress','cust_full_address','delivery_full_address','selected_address','selectedAddress','user_address','address','cust_location_name','cust_location_address','current_address','currentAddress'];
const ORDER_KEYS=['order_history','current_order','TIFFIN_ORDERS','TIFFIN_CUSTOMER_ORDERS','customerOrders','orders','cbeOrders','pastOrders','TIFFIN_ORDER_HISTORY'];
const $=s=>document.querySelector(s);const on=(el,type,fn,opts)=>{if(el)el.addEventListener(type,fn,opts)};const els={profileName:$('#profileName'),profilePhone:$('#profilePhone'),topbarGreeting:$('#topbarGreeting'),nameFieldValue:$('#nameFieldValue'),phoneDigits:$('#phoneDigits'),avatarCircle:$('#avatarCircle'),avatarButton:$('#avatarButton'),avatarInput:$('#avatarInput'),savedAddressList:$('#savedAddressList'),savedAddressScreen:$('#savedAddressScreen'),pastOrdersList:$('#pastOrdersList'),activeOrdersCount:$('#activeOrdersCount'),activeOrdersRow:$('#activeOrdersRow'),activeOrdersToggle:$('#activeOrdersToggle'),activeOrdersExpanded:$('#activeOrdersExpanded'),activeOrdersArrow:$('#activeOrdersArrow'),nameSheet:$('#nameSheet'),nameInput:$('#nameInput'),toast:$('#toast'),menuPopover:$('#menuPopover')};
let profile=loadProfile();
document.addEventListener('DOMContentLoaded',init);
function init(){renderAll();bindEvents()}
function bindEvents(){
 on($('#backButton'),'click',goBack);on($('#editNameButton'),'click',openNameSheet);on($('#cancelNameButton'),'click',closeNameSheet);on($('#saveNameButton'),'click',saveName);on(els.nameSheet,'click',e=>{if(e.target===els.nameSheet)closeNameSheet()});on(els.nameInput,'keydown',e=>{if(e.key==='Enter')saveName();if(e.key==='Escape')closeNameSheet()});
 on(els.avatarButton,'click',()=>els.avatarInput&&els.avatarInput.click());on(els.avatarInput,'change',saveAvatar);
 on($('#addAddressButton'),'click',showSavedAddressScreen);on($('#savedAddressBackButton'),'click',hideSavedAddressScreen);on($('#savedAddressAddButton'),'click',goToAddAddress);
 on($('#cartRow'),'click',()=>{location.href='cart.html'});on(els.activeOrdersToggle,'click',toggleActiveOrdersExpanded);on($('#helpRow'),'click',()=>{showToast('Help & Support coming soon')});
 on($('#dotMenuButton'),'click',toggleMenu);on(els.menuPopover,'click',e=>{if(e.target===els.menuPopover)closeMenu()});on($('#refreshProfileButton'),'click',()=>{closeMenu();refreshFromStorage();showToast('Profile refreshed')});on($('#goOrdersButton'),'click',()=>{location.href='track.html'});on($('#logoutButton'),'click',logout);
 window.addEventListener('pageshow',refreshFromStorage);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshFromStorage()});document.addEventListener('click',e=>{if(!e.target.closest('.track-past-menu-wrap'))closeProfilePastOrderMenus();if(!e.target.closest('.saved-address-card'))closeSavedAddressMenus();if(!e.target.closest('.active-order-menu-wrap'))closeActiveOrderMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSavedAddressMenus();if(els.savedAddressScreen&&els.savedAddressScreen.classList.contains('show'))hideSavedAddressScreen()}});
}
function refreshFromStorage(){profile=loadProfile();renderAll()}window.CBEProfileRefresh=refreshFromStorage;window.renderOrders=renderPastOrders;function renderAll(){renderProfile();renderAddresses();renderActiveOrdersCount();renderActiveOrdersExpanded();renderPastOrders()}
function renderActiveOrdersCount(){if(!els.activeOrdersCount)return;els.activeOrdersCount.textContent=String(getActiveOrdersCount())}
function renderActiveOrdersExpanded(){if(!els.activeOrdersExpanded)return;const orders=getActiveOrders();if(!orders.length){els.activeOrdersExpanded.innerHTML='<div class="active-order-empty">No active orders now.</div>';setActiveOrdersExpanded(false);return}els.activeOrdersExpanded.innerHTML='';orders.forEach(order=>els.activeOrdersExpanded.appendChild(buildActiveOrderCard(order)))}
function toggleActiveOrdersExpanded(){if(!els.activeOrdersRow)return;if(!getActiveOrdersCount()){showToast('No active orders now');return}setActiveOrdersExpanded(!els.activeOrdersRow.classList.contains('is-expanded'))}
function setActiveOrdersExpanded(expanded){if(!els.activeOrdersRow)return;els.activeOrdersRow.classList.toggle('is-expanded',!!expanded);if(els.activeOrdersToggle)els.activeOrdersToggle.setAttribute('aria-expanded',expanded?'true':'false');if(els.activeOrdersArrow)els.activeOrdersArrow.src=expanded?'./assets/profile/arrow-up-icon.svg':'./assets/profile/arrow-right-icons.svg'}
function buildActiveOrderCard(order){const id=cleanText(order.id)||'----';const safeId=escapeAttribute(id);const displayId=escapeHtml(String(id).replace(/^CBE-/i,''));const total='₹'+escapeHtml(formatMoney(order.total||order.totalPaid||order.amount||0));const placed=escapeHtml(formatOrderDate(order.createdAt||order.date||order.timestamp));const card=document.createElement('article');card.className='active-order-card';card.setAttribute('data-active-order-card',id);card.innerHTML=`<div class="active-order-top-row"><div class="active-order-id-pill">Order ID #${displayId}</div><div class="active-order-menu-wrap"><button class="active-order-menu-button" type="button" aria-label="Active order actions" data-active-order-menu="${safeId}"><img src="./assets/profile/3dot-menu-icon.svg" alt="" /></button><div class="active-order-action-menu" role="menu"><button class="active-order-menu-item" type="button" role="menuitem" data-active-order-track="${safeId}">Track order</button></div></div></div><div class="active-order-time-value"><div class="active-order-time">${placed}</div><div class="active-order-total-inline"><span>Total value:</span><strong>${total}</strong></div></div><div class="active-order-items-card"><div class="track-past-items">${buildProfilePastOrderItems(order.items)}</div><button class="active-order-track-button" type="button" data-active-order-track="${safeId}">Track order</button></div>`;card.querySelector('[data-active-order-menu]').addEventListener('click',event=>{event.stopPropagation();const open=card.classList.contains('is-active-menu-open');closeActiveOrderMenus();if(!open)card.classList.add('is-active-menu-open')});card.querySelectorAll('[data-active-order-track]').forEach(btn=>btn.addEventListener('click',event=>{event.stopPropagation();openActiveOrderDetails(order)}));return card}
function closeActiveOrderMenus(){document.querySelectorAll('.active-order-card.is-active-menu-open').forEach(card=>card.classList.remove('is-active-menu-open'))}
function openActiveOrderDetails(order){closeActiveOrderMenus();if(order&&order.id)localStorage.setItem('TIFFIN_SELECTED_ORDER_ID',String(order.id));if(order)localStorage.setItem('cbe_track_selected_order',JSON.stringify(order));location.href=order&&order.id?'track-fullscreen.html?orderId='+encodeURIComponent(order.id):'track.html'}
function renderProfile(){const name=cleanText(profile.name)||'Customer';const firstName=name.split(/\s+/).filter(Boolean)[0]||'Customer';const phone=normalizePhone(profile.phone||profile.mobile||profile.number||'');const digits=phone.digits||'0000000000';const displayPhone=phone.display||'+91-0000000000';els.profileName.textContent=name;if(els.topbarGreeting)els.topbarGreeting.textContent='Hello! '+firstName;els.nameFieldValue.textContent=name;els.profilePhone.textContent=displayPhone;els.phoneDigits.textContent=digits;if(profile.avatarDataUrl){els.avatarCircle.innerHTML='<img class="profile-photo-img" alt="Profile photo" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;border-radius:50%;display:block;" src="'+escapeAttribute(profile.avatarDataUrl)+'" />'}else{els.avatarCircle.innerHTML='<img class="profile-icon-img" alt="Profile icon" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;border-radius:50%;display:block;" src="./assets/profile/user-edit-icon.svg" />'}}
function renderAddresses(){
 const addresses=getSavedAddresses();
 els.savedAddressList.innerHTML='';
 if(!addresses.length){els.savedAddressList.innerHTML='<div class="empty-state">No saved address yet. Add one from the map flow.</div>';return}
 addresses.slice(0,12).forEach((address,index)=>{
  const card=document.createElement('article');
  card.className='saved-address-card';
  card.setAttribute('role','button');
  card.setAttribute('tabindex','0');
  const title=address.title||address.type||'Saved address';
  card.innerHTML=`<div class="saved-address-card-left"><div class="saved-address-pill">${getAddressIcon(title)}<span>${escapeHtml(title)}</span></div><div class="saved-address-line">${escapeHtml(address.line||'Address details not available')}</div></div><button class="saved-address-more-button" type="button" data-address-index="${index}" aria-label="Address actions for ${escapeAttribute(title)}"><span class="saved-address-more-dots" aria-hidden="true"><i></i><i></i><i></i></span></button><div class="saved-address-action-menu" role="menu"><button class="saved-address-action-item" type="button" role="menuitem" data-address-edit="${index}">Edit</button><button class="saved-address-action-item danger" type="button" role="menuitem" data-address-delete="${index}">Delete</button></div>`;
  card.addEventListener('click',event=>{if(event.target.closest('.saved-address-more-button')||event.target.closest('.saved-address-action-menu'))return;selectSavedAddress(address)});
  card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectSavedAddress(address)}});
  card.querySelector('.saved-address-more-button').addEventListener('click',event=>{event.stopPropagation();toggleSavedAddressMenu(card)});
  card.querySelector('[data-address-edit]').addEventListener('click',event=>{event.stopPropagation();goToEditAddress(address,index)});
  card.querySelector('[data-address-delete]').addEventListener('click',event=>{event.stopPropagation();deleteSavedAddress(address,index)});
  els.savedAddressList.appendChild(card)
 })
}
function showSavedAddressScreen(){if(!els.savedAddressScreen)return;renderAddresses();els.savedAddressScreen.classList.add('show');els.savedAddressScreen.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function hideSavedAddressScreen(){if(!els.savedAddressScreen)return;els.savedAddressScreen.classList.remove('show');els.savedAddressScreen.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function toggleSavedAddressMenu(card){const isOpen=card.classList.contains('is-address-menu-open');closeSavedAddressMenus();if(!isOpen)card.classList.add('is-address-menu-open')}
function closeSavedAddressMenus(){document.querySelectorAll('.saved-address-card.is-address-menu-open').forEach(card=>card.classList.remove('is-address-menu-open'))}
function selectSavedAddress(address){const activeLocation=buildActiveLocationFromAddress(address);writeActiveLocationLocal(activeLocation);try{sessionStorage.setItem('cbe_profile_selected_address','1');sessionStorage.setItem('cbe_profile_redirect_to_menu','1')}catch(_){}try{if(window.CBEProfileCustomerStore&&typeof window.CBEProfileCustomerStore.scheduleSync==='function')window.CBEProfileCustomerStore.scheduleSync('active_address_selected')}catch(_){}goToMenuInstantly()}
function goToMenuInstantly(){const menuUrl=new URL('menu.html',window.location.href);menuUrl.searchParams.set('from','profileAddress');try{window.location.assign(menuUrl.href)}catch(_){window.location.href=menuUrl.href}setTimeout(()=>{try{window.location.replace(menuUrl.href)}catch(_){window.location.href='menu.html?from=profileAddress'}},80)}
function buildActiveLocationFromAddress(address){const now=new Date().toISOString();const line=cleanText(address.line)||cleanText(address.fullAddress)||cleanText(address.address)||'Location saved';const title=cleanText(address.title||address.type||address.label||'Saved address');return Object.assign({},address,{id:address.id||('addr_'+Date.now()),title,type:title,label:title,line,address:line,displayAddress:line,fullAddress:line,selectedAt:now,updatedAt:now})}
function writeActiveLocationLocal(location){if(!location||typeof location!=='object')return;const raw=JSON.stringify(location);['activeDeliveryLocation','customer_active_delivery_location','cust_location_details','delivery_location_details','cust_location','delivery_location','selectedDeliveryAddress','currentDeliveryAddress','TIFFIN_SELECTED_ADDRESS','TIFFIN_ACTIVE_DELIVERY_LOCATION','cbe_active_delivery_location','active_delivery_location'].forEach(key=>{try{localStorage.setItem(key,raw)}catch(_){}});const shortAddress=cleanText(location.displayAddress||location.line||location.address||'');const fullAddress=cleanText(location.fullAddress||location.address||location.line||'');if(shortAddress){['cust_address','delivery_address','selected_address','current_address'].forEach(key=>localStorage.setItem(key,shortAddress))}if(fullAddress){['cust_full_address','delivery_full_address','selectedAddress','currentAddress'].forEach(key=>localStorage.setItem(key,fullAddress))}if(location.lat&&location.lng){localStorage.setItem('cust_lat',String(location.lat));localStorage.setItem('cust_lng',String(location.lng))}}
function deleteSavedAddress(address,index){const list=readSavedAddressListForMutation();if(!list.length){showToast('Address not found');return}const deleteIndex=findSavedAddressIndex(list,address,index);if(deleteIndex<0){showToast('Address not found');return}list.splice(deleteIndex,1);writeSavedAddressListForMutation(list);if(isSameAddress(readActiveAddressLocal(),address))clearActiveAddressLocal();closeSavedAddressMenus();renderAddresses();if(window.CBEProfileCustomerStore&&typeof window.CBEProfileCustomerStore.scheduleSync==='function')window.CBEProfileCustomerStore.scheduleSync('saved_address_deleted');showToast('Address deleted')}
function readSavedAddressListForMutation(){for(const key of SAVED_ADDRESS_LIST_KEYS){const value=parseJson(localStorage.getItem(key));if(Array.isArray(value))return value.filter(Boolean)}return[]}
function writeSavedAddressListForMutation(list){const raw=JSON.stringify(Array.isArray(list)?list.filter(Boolean):[]);['cust_saved_addresses','delivery_saved_addresses','TIFFIN_SAVED_ADDRESSES','tiffin_saved_addresses','CBE_SAVED_ADDRESSES','cbe_saved_addresses','savedAddresses','saved_addresses','savedDeliveryAddresses','delivery_addresses','TIFFIN_CUSTOMER_ADDRESSES'].forEach(key=>{try{localStorage.setItem(key,raw)}catch(_){}})}
function findSavedAddressIndex(list,address,fallbackIndex){const target=addressSignature(address);let found=list.findIndex(item=>{const normalized=normalizeAddress(item,false,'savedAddresses');return normalized&&addressSignature(normalized)===target});if(found<0&&fallbackIndex>=0&&fallbackIndex<list.length)found=fallbackIndex;return found}

      return firebase.auth().currentUser || null;
    } catch (_) {
      return null;
    }
  }

  function getIdentity() {
    const user = getAuthUser();
    const uid = clean(user?.uid || localStorage.getItem("cust_uid") || localStorage.getItem("customer_uid"));
    const phoneNumber = clean(user?.phoneNumber) || readPhoneFromLocal();
    const customerId = uid || phoneId(phoneNumber);

    if (!customerId) return null;

    return {
      customerId,
      uid,
      phoneNumber,
      source: uid ? "firebase_auth_uid" : "phone_local_storage"
    };
  }

  function getDb() {
    if (db) return db;
    try {
      if (!window.firebase || !firebase.firestore) return null;
      db = firebase.firestore();
      return db;
    } catch (error) {
      console.warn("Profile customer memory Firestore unavailable", error);
      return null;
    }
  }

  function getCustomerRef(identity = currentIdentity) {
    const firestore = getDb();
    if (!firestore || !identity || !identity.customerId) return null;
    return firestore.collection("customers").doc(identity.customerId);
  }

  function readSavedAddresses() {
    const keys = [
      "cust_saved_addresses",
      "delivery_saved_addresses",
      "savedAddresses",
      "TIFFIN_SAVED_ADDRESSES",
      "CBE_SAVED_ADDRESSES"
    ];

    for (const key of keys) {
      const parsed = parseJSON(localStorage.getItem(key), null);
      if (Array.isArray(parsed)) return parsed.filter(Boolean);
    }

    return [];
  }

  function writeSavedAddresses(addresses) {
    const safeList = Array.isArray(addresses) ? addresses.filter(Boolean) : [];
    const raw = stringify(safeList);
    if (!raw) return;

    localStorage.setItem("cust_saved_addresses", raw);
    localStorage.setItem("delivery_saved_addresses", raw);
    localStorage.setItem("savedAddresses", raw);
  }

  function readActiveLocation() {
    const keys = [
      "activeDeliveryLocation",
      "customer_active_delivery_location",
      "cust_location_details",
      "delivery_location_details",
      "cust_location",
      "delivery_location"
    ];

    for (const key of keys) {
      const parsed = parseJSON(localStorage.getItem(key), null);
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
    }

    return null;
  }

  function writeActiveLocation(location) {
    if (!location || typeof location !== "object") return;

    const raw = stringify(location);
    if (!raw) return;

    localStorage.setItem("activeDeliveryLocation", raw);
    localStorage.setItem("customer_active_delivery_location", raw);
    localStorage.setItem("cust_location_details", raw);
    localStorage.setItem("delivery_location_details", raw);

    const shortAddress = clean(location.displayAddress || location.display || localStorage.getItem("cust_address"));
    const fullAddress = clean(location.fullAddress || location.full || location.address || localStorage.getItem("cust_full_address"));

    if (shortAddress) {
      localStorage.setItem("cust_address", shortAddress);
      localStorage.setItem("delivery_address", shortAddress);
    }

    if (fullAddress) {
      localStorage.setItem("cust_full_address", fullAddress);
      localStorage.setItem("delivery_full_address", fullAddress);
    }

    if (location.lat && location.lng) {
      localStorage.setItem("cust_location", raw);
      localStorage.setItem("cust_lat", String(location.lat));
      localStorage.setItem("cust_lng", String(location.lng));
    }
  }

  function readProfile() {
    const saved = parseJSON(localStorage.getItem("TIFFIN_CUSTOMER_PROFILE"), null) ||
      parseJSON(localStorage.getItem("customerProfile"), null) ||
      {};

    return {
      ...(saved && typeof saved === "object" ? saved : {}),
      name: clean(saved?.name || localStorage.getItem("TIFFIN_CUSTOMER_NAME") || localStorage.getItem("customer_name")),
      phone: clean(saved?.phone || saved?.phoneNumber || currentIdentity?.phoneNumber || readPhoneFromLocal()),
      avatarDataUrl: clean(saved?.avatarDataUrl || saved?.avatar || saved?.profilePhoto)
    };
  }

  function writeProfile(profile) {
    if (!profile || typeof profile !== "object") return;

    const previous = readProfile();
    const next = {
      ...previous,
      ...profile,
      name: clean(profile.name || profile.displayName || profile.profileName || previous.name || "Customer"),
      phone: clean(profile.phone || profile.phoneNumber || currentIdentity?.phoneNumber || previous.phone),
      avatarDataUrl: clean(profile.avatarDataUrl || profile.avatar || profile.profilePhoto || previous.avatarDataUrl)
    };

    localStorage.setItem("TIFFIN_CUSTOMER_PROFILE", stringify(next));
    localStorage.setItem("customerProfile", stringify(next));

    if (next.name) {
      localStorage.setItem("TIFFIN_CUSTOMER_NAME", next.name);
      localStorage.setItem("customer_name", next.name);
    }

    if (next.phone) {
      localStorage.setItem("TIFFIN_CUSTOMER_PHONE", next.phone);
      localStorage.setItem("customer_phone", next.phone);
      localStorage.setItem("cust_phone", next.phone);
    }
  }

  function readCartItems() {
    const value = parseJSON(localStorage.getItem("cart"), []);
    if (Array.isArray(value)) return value.filter(item => item && Number(item.qty || item.quantity || 0) > 0);
    if (value && typeof value === "object") return Object.values(value).filter(item => item && Number(item.qty || item.quantity || 0) > 0);
    return [];
  }

  function writeCartItems(items) {
    if (!Array.isArray(items)) return;
    localStorage.setItem("cart", stringify(items.filter(item => item && Number(item.qty || item.quantity || 0) > 0)));
  }

  function addressKey(address) {
    if (!address || typeof address !== "object") return "";
    return [
      clean(address.id),
      clean(address.label || address.title || address.type),
      clean(address.fullAddress || address.full || address.displayAddress || address.display || address.addressDetails || address.address),
      clean(address.doorNo),
      clean(address.lat),
      clean(address.lng)
    ].join("|").toLowerCase();
  }

  function mergeAddresses(localList, remoteList) {
    const merged = [];
    const seen = new Set();

    [localList, remoteList].forEach(list => {
      if (!Array.isArray(list)) return;
      list.filter(Boolean).forEach(address => {
        const key = addressKey(address);
        const idKey = clean(address?.id).toLowerCase();
        if ((key && seen.has(key)) || (idKey && seen.has(`id:${idKey}`))) return;
        if (key) seen.add(key);
        if (idKey) seen.add(`id:${idKey}`);
        merged.push(address);
      });
    });

    return merged;
  }

  function refreshProfileUI() {
    try {
      if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
    } catch (_) {}
  }

  function clearPreviousCustomerCache() {
    [
      "cust_saved_addresses",
      "delivery_saved_addresses",
      "savedAddresses",
      "activeDeliveryLocation",
      "customer_active_delivery_location",
      "cust_location_details",
      "delivery_location_details",
      "cust_address",
      "delivery_address",
      "cust_full_address",
      "delivery_full_address",
      "cust_location",
      "cust_lat",
      "cust_lng",
      "cart"
    ].forEach(key => {
      try { localStorage.removeItem(key); } catch (_) {}
    });
  }

  function buildPayload(reason = "sync") {
    const now = new Date().toISOString();
    const profile = readProfile();

    return {
      uid: currentIdentity?.uid || "",
      phoneNumber: currentIdentity?.phoneNumber || profile.phone || "",
      customerId: currentIdentity?.customerId || "",
      identitySource: currentIdentity?.source || "",
      app: "coimbatore-foods-customer-pwa",
      sourcePage: "profile.html",
      syncReason: reason,

      name: profile.name || "Customer",
      profile: {
        name: profile.name || "Customer",
        phone: profile.phone || currentIdentity?.phoneNumber || "",
        avatarDataUrl: profile.avatarDataUrl || "",
        updatedAt: now
      },

      savedAddresses: readSavedAddresses(),
      activeDeliveryLocation: readActiveLocation(),
      currentCart: {
        items: readCartItems(),
        updatedAt: now
      },

      cacheVersion: CACHE_VERSION,
      updatedAt: now,
      lastSeenAt: now
    };
  }

  async function restoreFromFirebase(identity) {
    const ref = getCustomerRef(identity);
    if (!ref) return;

    restoring = true;

    try {
      const previousCustomerId = clean(localStorage.getItem(CUSTOMER_ID_KEY));
      const isDifferentCustomer = previousCustomerId && previousCustomerId !== identity.customerId;

      if (isDifferentCustomer) clearPreviousCustomerCache();

      localStorage.setItem(CUSTOMER_ID_KEY, identity.customerId);
      localStorage.setItem(CACHE_VERSION_KEY, CACHE_VERSION);

      const snapshot = await ref.get();
      const remote = snapshot.exists ? (snapshot.data() || {}) : {};

      const remoteProfile = remote.profile && typeof remote.profile === "object" ? remote.profile : {};
      const remoteName = clean(remoteProfile.name || remote.name || remote.displayName);
      const remoteAvatar = clean(remoteProfile.avatarDataUrl || remote.avatarDataUrl || remote.avatar || remote.profilePhoto);

      if (remoteName || remoteAvatar || identity.phoneNumber) {
        writeProfile({
          name: remoteName || undefined,
          phone: identity.phoneNumber || remoteProfile.phone || remote.phoneNumber,
          avatarDataUrl: remoteAvatar || undefined
        });
      }

      const localAddresses = readSavedAddresses();
      const remoteAddresses = Array.isArray(remote.savedAddresses) ? remote.savedAddresses.filter(Boolean) : [];
      const mergedAddresses = isDifferentCustomer ? remoteAddresses : mergeAddresses(localAddresses, remoteAddresses);
      if (mergedAddresses.length) writeSavedAddresses(mergedAddresses);

      const localActiveLocation = readActiveLocation();
      const remoteActiveLocation = remote.activeDeliveryLocation && typeof remote.activeDeliveryLocation === "object"
        ? remote.activeDeliveryLocation
        : null;
      if ((!localActiveLocation || isDifferentCustomer) && remoteActiveLocation) writeActiveLocation(remoteActiveLocation);

      const localCart = readCartItems();
      const remoteCart = Array.isArray(remote.currentCart?.items) ? remote.currentCart.items.filter(Boolean) : [];
      if ((!localCart.length || isDifferentCustomer) && remoteCart.length) writeCartItems(remoteCart);

      currentIdentity = identity;
      refreshProfileUI();
      await syncNow("profile_restore");
    } catch (error) {
      console.warn("Profile customer memory restore skipped", error);
      refreshProfileUI();
    } finally {
      restoring = false;
    }
  }

  async function syncNow(reason = "manual") {
    if (restoring) return;
    currentIdentity = getIdentity() || currentIdentity;
    const ref = getCustomerRef(currentIdentity);
    if (!ref) return;

    const payload = buildPayload(reason);
    const snapshot = stringify(payload);
    if (snapshot && snapshot === lastSnapshot) return;

    try {
      await ref.set(payload, { merge: true });
      lastSnapshot = snapshot;
    } catch (error) {
      console.warn("Profile customer memory sync skipped", error);
    }
  }

  function scheduleSync(reason = "local_change") {
    if (restoring) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(reason), SYNC_DELAY_MS);
  }

  function boot() {
    currentIdentity = getIdentity();
    if (!currentIdentity) {
      window.CBEProfileCustomerStore.status = "waiting_for_customer_identity";
      refreshProfileUI();
      return;
    }

    window.CBEProfileCustomerStore.status = "ready";
    window.CBEProfileCustomerStore.identity = currentIdentity;
    restoreFromFirebase(currentIdentity);
  }

  function bootWhenAuthReady() {
    try {
      if (window.firebase && firebase.auth && typeof firebase.auth().onAuthStateChanged === "function") {
        let didBoot = false;
        firebase.auth().onAuthStateChanged(() => {
          if (didBoot) return;
          didBoot = true;
          boot();
        });

        setTimeout(() => {
          if (didBoot) return;
          didBoot = true;
          boot();
        }, 1200);
        return;
      }
    } catch (_) {}

    boot();
  }

  window.CBEProfileCustomerStore = {
    status: "booting",
    identity: null,
    scheduleSync,
    syncNow,
    restore: boot,
    readLocal: () => buildPayload("read_local")
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootWhenAuthReady, { once: true });
  else bootWhenAuthReady();

  window.addEventListener("pagehide", () => syncNow("pagehide"));
})();
</script>

<script>
(function syncProfilePastOrdersFromFirestore() {
  function clean(value) { return value === null || value === undefined ? "" : String(value).trim(); }
  function parseJSON(value, fallback) { try { return JSON.parse(value); } catch (_) { return fallback; } }
  function phone10(value) {
    const digits = clean(value).replace(/\D/g, "");
    return digits.length > 10 ? digits.slice(-10) : digits;
  }
  function timestampToISO(value) {
    if (!value) return "";
    if (typeof value.toDate === "function") return value.toDate().toISOString();
    if (value.seconds) return new Date(value.seconds * 1000).toISOString();
    if (typeof value === "string") return value;
    return "";
  }
  const PROFILE_REMOTE_STATUS_RANK = { cancelled: 100, canceled: 100, delivered: 90, completed: 90, reached: 80, arrived: 80, reached_customer: 80, reached_location: 80, at_customer: 80, picked_up: 70, pickup_done: 70, out_for_delivery: 70, outfordelivery: 70, on_the_way: 70, on_way: 70, preparing: 60, cooking: 60, ready: 60, accepted: 50, admin_accepted: 50, confirmed_by_restaurant: 50, confirmed: 40, order_received: 40, received: 40, placed: 40, paid: 35, pending: 10 };
  function getOrderStatus(order) {
    const candidates = [order?.adminStatus, order?.orderStatus, order?.deliveryStatus, order?.riderStatus, order?.trackStatus, order?.status]
      .map(value => clean(value).toLowerCase().replace(/[\s-]+/g, "_"))
      .filter(Boolean);
    if (!candidates.length) return "";
    return candidates.sort((a, b) => (PROFILE_REMOTE_STATUS_RANK[b] || 0) - (PROFILE_REMOTE_STATUS_RANK[a] || 0))[0];
  }
  function normalizeOrder(id, data, sourceRank = 0, sourceName = "remote") {
    if (!data) return null;
    const pickedStatus = getOrderStatus(data) || "confirmed";
    return {
      id,
      ...data,
      createdAt: timestampToISO(data.createdAt) || data.createdAtClient || data.createdAt || "",
      updatedAt: timestampToISO(data.updatedAt) || data.updatedAt || "",
      deliveredAt: timestampToISO(data.deliveredAt) || data.deliveredAt || "",
      items: Array.isArray(data.items) ? data.items : [],
      total: Number(data.totals?.total ?? data.total ?? data.totalPaid ?? data.amount ?? 0),
      restaurantName: data.restaurantName || data.storeName || "Coimbatore Foods",
      status: pickedStatus,
      orderStatus: pickedStatus,
      adminStatus: pickedStatus,
      deliveryStatus: pickedStatus,
      __orderSourceRank: sourceRank,
      __orderSource: sourceName
    };
  }
  function stampOrderStatus(order, pickedStatus) {
    if (!order || !pickedStatus) return order;
    order.status = pickedStatus;
    order.orderStatus = pickedStatus;
    order.adminStatus = pickedStatus;
    order.deliveryStatus = pickedStatus;
    return order;
  }
  function mergeOrderBySourceRank(existing, incoming) {
    if (!existing) return incoming || null;
    if (!incoming) return existing;
    const existingRank = Number(existing.__orderSourceRank || 0);
    const incomingRank = Number(incoming.__orderSourceRank || 0);
    const merged = incomingRank >= existingRank ? { ...existing, ...incoming } : { ...incoming, ...existing };
    const pickedStatus = incomingRank >= existingRank
      ? (getOrderStatus(incoming) || getOrderStatus(existing) || getOrderStatus(merged))
      : (getOrderStatus(existing) || getOrderStatus(incoming) || getOrderStatus(merged));
    merged.__orderSourceRank = Math.max(existingRank, incomingRank);
    merged.__orderSource = incomingRank >= existingRank ? (incoming.__orderSource || existing.__orderSource || "remote") : (existing.__orderSource || incoming.__orderSource || "remote");
    return pickedStatus ? stampOrderStatus(merged, pickedStatus) : merged;
  }
  function saveAndRefresh(orders) {
    try {
      localStorage.setItem("order_history", JSON.stringify(orders));
      localStorage.setItem("TIFFIN_ORDER_HISTORY", JSON.stringify(orders));
    } catch (_) {}
    if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
    else if (typeof window.renderOrders === "function") window.renderOrders();
  }
  function boot() {
    if (!window.firebase || !window.TIFFIN_FIREBASE_CONFIG || !window.TIFFIN_FIREBASE_CONFIG.apiKey) {
      if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(window.TIFFIN_FIREBASE_CONFIG);
      const auth = firebase.auth();
      const db = firebase.firestore();
      auth.onAuthStateChanged(user => {
        const localUid = clean(localStorage.getItem("cust_uid"));
        const customerId = clean(user?.uid || localUid);
        const customerPhone = phone10(user?.phoneNumber || localStorage.getItem("cust_phone") || localStorage.getItem("customer_phone") || "");
        if (!customerId && !customerPhone) {
          if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
          return;
        }
        let latestByUid = [];
        let latestByPhone = [];
        let latestStoreByUid = [];
        let latestStoreByPhone = [];
        let latestCustomerOrders = [];
        function mergeAndRender() {
          const map = new Map();
          [...latestCustomerOrders, ...latestByUid, ...latestByPhone, ...latestStoreByUid, ...latestStoreByPhone].forEach(order => {
            if (!order || !order.id) return;
            map.set(order.id, mergeOrderBySourceRank(map.get(order.id), order));
          });
          const orders = Array.from(map.values()).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          saveAndRefresh(orders);
        }
        if (customerId) {
          db.collection("orders")
            .where("customerId", "==", customerId)
            .limit(30)
            .onSnapshot(snapshot => {
              latestByUid = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data(), 2, "top")).filter(Boolean);
              mergeAndRender();
            }, error => console.warn("Profile order history UID sync failed", error));
        }
        if (customerPhone) {
          db.collection("orders")
            .where("customerPhone", "==", customerPhone)
            .limit(30)
            .onSnapshot(snapshot => {
              latestByPhone = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data(), 2, "top")).filter(Boolean);
              mergeAndRender();
            }, error => console.warn("Profile order history phone sync failed", error));
        }
        const storeOrders = db.collection("stores").doc(window.TIFFIN_STORE_ID || "main").collection("orders");
        if (customerId) {
          storeOrders.where("customerId", "==", customerId).limit(30).onSnapshot(snapshot => {
            latestStoreByUid = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data(), 3, "store")).filter(Boolean);
            mergeAndRender();
          }, error => console.warn("Profile store order UID sync failed", error));
          db.collection("customers").doc(customerId).collection("orders").limit(30).onSnapshot(snapshot => {
            latestCustomerOrders = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data(), 1, "customer")).filter(Boolean);
            mergeAndRender();
          }, error => console.warn("Profile customer order sync failed", error));
        }
        if (customerPhone) {
          storeOrders.where("customerPhone", "==", customerPhone).limit(30).onSnapshot(snapshot => {
            latestStoreByPhone = snapshot.docs.map(doc => normalizeOrder(doc.id, doc.data(), 3, "store")).filter(Boolean);
            mergeAndRender();
          }, error => console.warn("Profile store order phone sync failed", error));
        }
      });
    } catch (error) {
      console.warn("Profile order history sync failed", error);
      if (typeof window.CBEProfileRefresh === "function") window.CBEProfileRefresh();
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, { once: true });
  else boot();
})();
</script>


<script>
(function preventMobileDoubleTapZoom(){
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(event){
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('gesturestart', function(event){
    event.preventDefault();
  }, { passive: false });
})();
</script>
