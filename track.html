<title>Track Order - Coimbatore Foods</title>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('orderId') || '';
  if (!orderId) {
    try {
      var selected = JSON.parse(localStorage.getItem('cbe_track_selected_order') || 'null');
      orderId = selected && (selected.id || selected.orderId || selected.order_id || selected.receipt || selected.razorpayOrderId || selected.razorpay_order_id) || '';
    } catch (_) {}
  }
  var target = 'track-fullscreen.html' + (orderId ? '?orderId=' + encodeURIComponent(orderId) : '');
  window.location.replace(target);
})();
</script>
