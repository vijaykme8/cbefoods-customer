<script>
(function setupTrackListScreen() {
  const emptyScreen = document.getElementById('trackEmptyScreen');
  const addedScreen = document.getElementById('trackAddedScreen');

  function readJSON(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function normalizeOrders(value) {
    if (!value) return [];
    if (Array.isArray(value)) return value.filter(Boolean);
    if (typeof value === 'object') return Object.values(value).filter(Boolean);
    return [];
  }

  const TRACK_ORDER_KEYS = [
    'current_order',
    'order_history',
    'previous_orders',
    'orders',
    'customer_orders',
    'TIFFIN_ORDER_HISTORY',
    'TIFFIN_CUSTOMER_ORDERS',
    'customerOrders',
    'cbeOrders',
    'pastOrders',
    'CBE_TRACK_CUSTOMER_ORDERS'
  ];

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function cleanText(value) {
    return value === null || value === undefined ? '' : String(value).trim();
  }

  function phone10(value) {
    const digits = cleanText(value).replace(/\D/g, '');
    return digits.length > 10 ? digits.slice(-10) : digits;
  }

  function readProfileObject() {
    const keys = [
      'TIFFIN_CUSTOMER_PROFILE',
      'CBE_CUSTOMER_PROFILE',
      'customerProfile',
      'cust_profile',
      'userProfile',
      'profile',
      'customer'
    ];

    for (const key of keys) {
      const value = readJSON(key);
      if (value && typeof value === 'object' && !Array.isArray(value)) return value;
    }

    return {};
  }

  function getCurrentCustomerIdentity() {
    const profile = readProfileObject();
    const auth = readJSON('cust_auth') || readJSON('customerAuth') || {};
    const authObj = auth && typeof auth === 'object' ? auth : {};

    const uid = cleanText(
      localStorage.getItem('cust_uid') ||
      localStorage.getItem('customer_uid') ||
      localStorage.getItem('TIFFIN_CUSTOMER_UID') ||
      localStorage.getItem('firebase_uid') ||
      localStorage.getItem('uid') ||
      authObj.uid ||
      authObj.userId ||
      authObj.customerId ||
      profile.uid ||
      profile.customerId ||
      profile.id ||
      ''
    );

    const phone = phone10(
      localStorage.getItem('cust_phone') ||
      localStorage.getItem('cust_mobile') ||
      localStorage.getItem('customer_phone') ||
      localStorage.getItem('customer_mobile') ||
      localStorage.getItem('TIFFIN_CUSTOMER_PHONE') ||
      localStorage.getItem('mobile') ||
      authObj.phone ||
      authObj.mobile ||
      authObj.phoneNumber ||
      profile.phone ||
      profile.mobile ||
      profile.phoneNumber ||
      ''
    );

    return { uid, phone };
  }

  function getOrderUidValues(order) {
    return [
      order?.customerId,
      order?.customerUID,
      order?.customerUid,
      order?.uid,
      order?.userId,
      order?.firebaseUid,
      order?.customer?.id,
      order?.customer?.uid,
      order?.customer?.customerId,
      order?.user?.uid,
      order?.user?.id
    ].map(cleanText).filter(Boolean);
  }

  function getOrderPhone(order) {
    return phone10(
      order?.customerPhone ||
      order?.customerMobile ||
      order?.phone ||
      order?.mobile ||
      order?.contact ||
      order?.customer?.phone ||
      order?.customer?.mobile ||
      order?.customer?.contact ||
      order?.user?.phone ||
      order?.user?.mobile ||
      ''
    );
  }

  function orderBelongsToCurrentCustomer(order) {
    const identity = getCurrentCustomerIdentity();

    /*
      If auth details are not available yet, keep local paid orders visible.
      Once Firebase/auth restores uid or phone, filtering becomes strict.
    */
    if (!identity.uid && !identity.phone) return true;

    const uidValues = getOrderUidValues(order);
    const orderPhone = getOrderPhone(order);
    const hasCustomerMarker = uidValues.length > 0 || Boolean(orderPhone);

    if (identity.uid && uidValues.includes(identity.uid)) return true;
    if (identity.phone && orderPhone && orderPhone === identity.phone) return true;

    /*
      Legacy orders without customer markers can leak between phone accounts.
      From customer-memory foundation onward, Track should show only orders tied
      to the logged-in phone/uid. This keeps one customer’s order private from another.
    */
    if (!hasCustomerMarker) return false;

    return false;
  }

  function getPaymentStatus(order) {
    return String(
      order?.paymentStatus ||
      order?.payment?.status ||
      order?.razorpayPaymentStatus ||
      ''
    ).toLowerCase().trim().replace(/[\s-]+/g, '_');
  }

  function isPaymentBlocked(order) {
    const status = getAdminOrderStatus(order);
    const paymentStatus = getPaymentStatus(order);

    const blockedStatus = [
      'checkout_ready',
      'payment_pending',
      'pending_payment',
      'payment_initiated',
      'awaiting_payment',
      'created'
    ];

    const blockedPayment = [
      'pending',
      'unpaid',
      'failed',
      'cancelled',
      'canceled',
      'created'
    ];

    if (blockedStatus.includes(status)) return true;
    if (blockedPayment.includes(paymentStatus)) return true;
    return false;
  }

  function isPaidOrder(order) {
    const paymentStatus = getPaymentStatus(order);
    const paymentMethod = String(
      order?.paymentMethod ||
      order?.payment?.method ||
      order?.method ||
      ''
    ).toLowerCase().trim().replace(/[\s-]+/g, '_');

    if (['paid', 'success', 'captured', 'completed', 'payment_success'].includes(paymentStatus)) return true;
    if (order?.paidAt || order?.paymentId || order?.razorpayPaymentId || order?.razorpay_payment_id) return true;

    /*
      Keep COD-compatible, but Razorpay/card/UPI attempts still require success.
    */
    if (['cod', 'cash', 'cash_on_delivery'].includes(paymentMethod) && !isPaymentBlocked(order)) return true;

    return false;
  }

  function collectTrackOrders() {
    const orders = [];

    TRACK_ORDER_KEYS.forEach(key => {
      const value = key === 'current_order' ? readJSON(key) : normalizeOrders(readJSON(key));

      if (key === 'current_order') {
        if (value && typeof value === 'object') orders.push({ ...value, __trackSourceKey: key });
        return;
      }

      normalizeOrders(value).forEach(order => {
        if (order && typeof order === 'object') orders.push({ ...order, __trackSourceKey: key });
      });
    });

    return orders;
  }

  function getOrderId(order) {
    const direct = order?.id || order?.orderId || order?.order_id || order?.receipt || order?.razorpayOrderId || order?.paymentId || order?.payment?.id || '';
    if (direct) return String(direct);

    const seed = JSON.stringify({
      createdAt: getDateSource(order),
      total: getTotal(order),
      items: getItems(order).map(item => [getItemName(item), getItemQty(item), getItemPrice(item)]),
      phone: order?.customerPhone || order?.customer?.phone || order?.phone || ''
    });
    let hash = 0;
    for (let i = 0; i < seed.length; i++) {
      hash = ((hash << 5) - hash) + seed.charCodeAt(i);
      hash |= 0;
    }
    return `LOCAL-${Math.abs(hash).toString(36).toUpperCase()}`;
  }

  function getAdminOrderStatus(order) {
    return String(
      order?.adminStatus ||
      order?.orderStatus ||
      order?.deliveryStatus ||
      order?.riderStatus ||
      order?.status ||
      'confirmed'
    ).toLowerCase().trim().replace(/[\s-]+/g, '_');
  }

  function getOrderStatusVariant(order) {
    const status = getAdminOrderStatus(order);

    if (['received', 'confirmed', 'checkout_ready', 'placed', 'order_placed', 'accepted', 'paid', 'payment_success', 'new'].includes(status)) return 'received';
    if (['preparing', 'food_preparing', 'being_prepared', 'cooking', 'rider_assigned', 'assigned'].includes(status)) return 'preparing';
    if (['picked_up', 'pickup_done', 'out_for_delivery', 'outfordelivery', 'on_the_way', 'on_way', 'dispatched'].includes(status)) return 'out_for_delivery';
    if (['reached_location', 'reached', 'arrived', 'arrived_location', 'at_location', 'nearby'].includes(status)) return 'reached_location';
    if (['delivered', 'completed'].includes(status)) return 'reached_location';

    return 'received';
  }

  function getOrders() {
    const seen = new Set();

    return collectTrackOrders()
      .filter(order => order && typeof order === 'object')
      .filter(order => orderBelongsToCurrentCustomer(order))
      .filter(order => isPaidOrder(order))
      .filter(order => {
        const status = getAdminOrderStatus(order);
        if (isPaymentBlocked(order)) return false;
        return !['delivered', 'completed', 'cancelled', 'canceled'].includes(status);
      })
      .filter(order => {
        const id = getOrderId(order);
        if (seen.has(id)) return false;
        seen.add(id);
        return true;
      })
      .sort((a, b) => {
        const dateA = toDate(getDateSource(a)) || new Date(0);
        const dateB = toDate(getDateSource(b)) || new Date(0);
        return dateB - dateA;
      });
  }

  function getPastOrders() {
    const activeIds = new Set(getOrders().map(order => getOrderId(order)));
    const seen = new Set();

    return collectTrackOrders()
      .filter(order => order && typeof order === 'object')
      .filter(order => orderBelongsToCurrentCustomer(order))
      .filter(order => {
        const status = getAdminOrderStatus(order);
        const isPastStatus =
          ['delivered', 'completed', 'cancelled', 'canceled'].includes(status) ||
          order?.deliveredAt ||
          order?.completedAt;

        if (!isPastStatus) return false;
        if (activeIds.has(getOrderId(order))) return false;

        /*
          Past orders must still be real paid/confirmed orders.
          Unpaid Razorpay attempts and cancelled payment attempts must never appear.
        */
        if (!isPaidOrder(order)) return false;
        if (isPaymentBlocked(order) && !['cancelled', 'canceled'].includes(status)) return false;

        return true;
      })
      .filter(order => {
        const id = getOrderId(order);
        if (seen.has(id)) return false;
        seen.add(id);
        return true;
      })
      .sort((a, b) => {
        const dateA = toDate(getDateSource(a)) || new Date(0);
        const dateB = toDate(getDateSource(b)) || new Date(0);
        return dateB - dateA;
      });
  }

  function pastStatusLabel(order) {
    const status = getAdminOrderStatus(order);
    if (['cancelled', 'canceled'].includes(status)) return 'Cancelled';

  function buildPastOrdersSection() {

  function getItems(order) {
    const items = order?.items || order?.cartItems || order?.orderItems || [];
    if (Array.isArray(items)) return items.filter(Boolean);
    if (items && typeof items === 'object') return Object.values(items).filter(Boolean);
    return [];
  }

  function getItemName(item) {
    return item?.name || item?.title || item?.itemName || item?.productName || 'Item';
  }

  function getItemQty(item) {
    return Number(item?.qty ?? item?.quantity ?? item?.count ?? 1) || 1;
  }


  function getItemPrice(item) {
    const lineTotal = Number(item?.lineTotal ?? item?.total ?? item?.totalPrice ?? item?.amount ?? 0) || 0;
    const qty = getItemQty(item);
    if (lineTotal && qty > 1 && !item?.price && !item?.unitPrice) return lineTotal / qty;
    return Number(item?.price ?? item?.unitPrice ?? item?.rate ?? item?.sellingPrice ?? lineTotal ?? 0) || 0;
  }

  function getTotal(order) {
    return Number(
      order?.total ??
      order?.grandTotal ??
      order?.totalAmount ??
      order?.amount ??
      order?.paidAmount ??
      order?.amountPaid ??
      order?.totalPaid ??
      order?.payableAmount ??
      order?.totals?.total ??
      order?.totals?.grandTotal ??
      order?.totals?.finalTotal ??
      order?.payment?.total ??
      order?.payment?.amount ??
      0
    ) || 0;
  }

  function getDateSource(order) {
    return order?.placedAt ||
      order?.paidAt ||
      order?.createdAt ||
      order?.createdAtClient ||
      order?.created_at ||
      order?.orderDate ||
      order?.orderedAt ||
      order?.orderTime ||
      order?.dateTime ||
      order?.date ||
      order?.timestamp ||
      order?.updatedAt ||
      order?.payment?.createdAt ||
      order?.payment?.paidAt ||
      '';
  }

  function toDate(value) {
    if (!value) return null;
    if (value instanceof Date && !Number.isNaN(value.getTime())) return value;
    if (typeof value === 'number') {
      const date = new Date(value < 10000000000 ? value * 1000 : value);
      return Number.isNaN(date.getTime()) ? null : date;
    }
    if (typeof value === 'string') {
      const input = value.trim();
      if (!input) return null;
      if (/^\d+$/.test(input)) {
        const numeric = Number(input);
        const date = new Date(numeric < 10000000000 ? numeric * 1000 : numeric);
        return Number.isNaN(date.getTime()) ? null : date;
      }
      let date = new Date(input);
      if (!Number.isNaN(date.getTime())) return date;
      const match = input.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[,\s]+(\d{1,2}):(\d{2})\s*(am|pm)?)?/i);
      if (match) {
        const day = Number(match[1]);
        const month = Number(match[2]) - 1;
        let year = Number(match[3]);
        if (year < 100) year += 2000;
        let hour = Number(match[4] || 0);
        const minute = Number(match[5] || 0);
        const ampm = String(match[6] || '').toLowerCase();
        if (ampm === 'pm' && hour < 12) hour += 12;
        if (ampm === 'am' && hour === 12) hour = 0;
        date = new Date(year, month, day, hour, minute);
        return Number.isNaN(date.getTime()) ? null : date;
      }
      return null;
    }
    if (typeof value === 'object') {
      if (typeof value.toDate === 'function') {
        const date = value.toDate();
        return Number.isNaN(date.getTime()) ? null : date;
      }
      const seconds = value.seconds ?? value._seconds;
      const millis = value.milliseconds ?? value._milliseconds;
      if (typeof seconds === 'number') {
        const date = new Date(seconds * 1000);
        return Number.isNaN(date.getTime()) ? null : date;
      }
      if (typeof millis === 'number') {
        const date = new Date(millis);
        return Number.isNaN(date.getTime()) ? null : date;
      }
    }
    return null;
  }

  function formatDateTime(order) {
    const date = toDate(getDateSource(order));
    if (!date) return 'Just now';
    const day = String(date.getDate()).padStart(2, '0');
    const month = date.toLocaleString('en-IN', { month: 'short' });
    const year = date.getFullYear();
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const suffix = hours >= 12 ? 'pm' : 'am';
    hours = hours % 12 || 12;
    return `${day} ${month} ${year}, ${hours}:${minutes}${suffix}`;
  }

  function money(value) {
    return `₹${Math.round(Number(value || 0))}`;
  }


  function getNumberValue(value) {
    if (value === null || value === undefined || value === '') return null;
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : null;
  }

  function getCoordsFromObject(source) {
    if (!source || typeof source !== 'object') return null;
    const lat = getNumberValue(source.lat ?? source.latitude ?? source.customerLat ?? source.deliveryLat ?? source.restaurantLat ?? source.adminLat);
    const lng = getNumberValue(source.lng ?? source.lon ?? source.long ?? source.longitude ?? source.customerLng ?? source.deliveryLng ?? source.restaurantLng ?? source.adminLng);
    if (lat === null || lng === null) return null;
    return { lat, lng };
  }

  function distanceKmBetween(a, b) {
    if (!a || !b) return null;
    const R = 6371;
    const toRad = degree => degree * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat);
    const dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function deliveryFeeForOrder(order) {
    const savedFee = getNumberValue(order?.deliveryFee ?? order?.totals?.delivery);
    const savedDistance = getNumberValue(order?.deliveryDistanceKm ?? order?.totals?.deliveryDistanceKm ?? order?.deliveryFeeRule?.distanceKm);
    const restaurant = getCoordsFromObject(order?.restaurantLocation) || getCoordsFromObject(order?.adminLocation) || getCoordsFromObject(order?.storeLocation);
    const customer = getCoordsFromObject(order?.customerLocation) || getCoordsFromObject(order?.deliveryLocation) || getCoordsFromObject(order?.location);
    const distance = distanceKmBetween(restaurant, customer) ?? savedDistance;
    if (distance === null) return savedFee ?? 10;
    return 10 + Math.max(0, Math.ceil(distance - 10)) * 2;
  }

  function computedTotalForOrder(order) {
    const saved = getTotal(order);
    if (saved) return saved;
    const items = getItems(order);
    const itemTotal = items.reduce((sum, item) => sum + getItemPrice(item) * getItemQty(item), 0);
    const tax = Number(order?.tax ?? order?.taxAmount ?? order?.totals?.tax ?? 0) || 0;
    const fee = deliveryFeeForOrder(order);
    return itemTotal + tax + fee;
  }

  function setFirstTextMatching(root, matcher, value) {

  }

  function renderStatus(order) {

          <img class="track-status-icon-img" src="${base}/${icon}?v=active-status2" alt="" style="width:16px;height:16px;display:block;object-fit:contain;" onerror="this.style.display='none';">

  function renderItems(order) {

            <div style="width: 20px; height: 20px; padding: 4px; background: rgba(253, 253, 255, 0.06); border-radius: 30px; flex-direction: column; justify-content: center; align-items: center; display: inline-flex;">
              <div style="text-align: right; color: #FDFDFF; font-size: 12px; font-family: General Sans; font-weight: 400; line-height: 12px;">${getItemQty(item)}</div>
            </div>

  function updateCard(card, order) {

          <div class="track-order-placed-time" style="align-self:stretch;justify-content:center;display:flex;flex-direction:column;color:#FDFDFF;font-size:12px;font-family:General Sans;font-weight:500;line-height:14.40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${placed}</div>
        </div>

          <div style="align-self:stretch;text-align:right;justify-content:center;display:flex;flex-direction:column;color:rgba(253,253,255,.50);font-size:12px;font-family:General Sans;font-weight:400;line-height:14.40px;">Total value:</div>
          <div class="track-order-total-value" style="align-self:stretch;text-align:right;justify-content:center;display:flex;flex-direction:column;color:#FDFDFF;font-size:12px;font-family:General Sans;font-weight:500;line-height:14.40px;">${total}</div>

  function showEmpty() {
    emptyScreen.classList.add('is-active');
    addedScreen.classList.remove('is-active');
    renderPastOrdersForVisibleState();
  }

  function showAdded(orders) {
    emptyScreen.classList.remove('is-active');
    addedScreen.classList.add('is-active');

    const root = document.getElementById('trackAddedRaw');
    const content = root?.querySelector('[data-layer="empty-tract-content"]');
    const firstCard = root?.querySelector('[data-layer="item-cards"]');

    if (!content || !firstCard) return;

    const template = firstCard.outerHTML;
    Array.from(content.querySelectorAll('[data-layer="item-cards"]')).forEach(card => card.remove());

    orders.forEach(order => {
      const tpl = document.createElement('template');
      tpl.innerHTML = template.trim();
      const card = tpl.content.firstElementChild;
      content.appendChild(card);
      updateCard(card, order);
    });

    renderPastOrdersForVisibleState();
  }

  function render() {
    const orders = getOrders();

    if (!orders.length) {
      showEmpty();
      return;
    }

    showAdded(orders);
  }


  function normalizeReorderItem(item, index = 0) {
    const qty = getItemQty(item);
    const name = getItemName(item);
    return {
      ...item,
      id: item?.id ?? item?.productId ?? item?.menuId ?? item?.itemId ?? name ?? `reorder-${index}`,
      name,
      title: item?.title ?? name,
      price: getItemPrice(item),
      qty,
      quantity: qty,
      image: item?.image ?? item?.img ?? item?.imageUrl ?? item?.photo ?? item?.thumbnail ?? item?.asset ?? ''
    };
  }

  function closePastOrderMenus() {
    document.querySelectorAll('.track-past-order-card.is-menu-open').forEach(card => {
      card.classList.remove('is-menu-open');
    });
  }

  function reorderPastOrderById(id) {
    const selected = getPastOrders().find(order => getOrderId(order) === id);
    if (!selected) return;

    const items = getItems(selected).map(normalizeReorderItem).filter(item => Number(item.qty || 0) > 0);
    if (!items.length) return;

    localStorage.setItem('cart', JSON.stringify(items));
    localStorage.removeItem('cbe_cart_cleared_at');
    localStorage.removeItem('cbe_cart_cleared_customer_id');
    localStorage.setItem('cbe_reorder_source_order_id', String(id));
    window.location.href = 'cart.html';
  }

  document.addEventListener('click', function(event) {
    const pastMenuBtn = event.target.closest('[data-track-past-menu]');
    if (pastMenuBtn) {
      const card = pastMenuBtn.closest('.track-past-order-card');
      const isOpen = card?.classList.contains('is-menu-open');
      closePastOrderMenus();
      if (card && !isOpen) card.classList.add('is-menu-open');
      event.preventDefault();
      return;
    }

    const pastReorderBtn = event.target.closest('[data-track-past-reorder]');
    if (pastReorderBtn) {
      const id = pastReorderBtn.getAttribute('data-track-past-reorder');
      closePastOrderMenus();
      reorderPastOrderById(id);
      event.preventDefault();
      return;
    }

    const pastBtn = event.target.closest('[data-track-past-details]');
    if (pastBtn) {
      const id = pastBtn.getAttribute('data-track-past-details');
      const selected = getPastOrders().find(order => getOrderId(order) === id);
      if (selected) {
        localStorage.setItem('cbe_track_selected_order', JSON.stringify(selected));
        localStorage.setItem('TIFFIN_SELECTED_ORDER_ID', String(id));
      }
      closePastOrderMenus();
      window.location.href = `track-fullscreen.html?orderId=${encodeURIComponent(id || '')}`;
      event.preventDefault();
      return;
    }

    if (!event.target.closest('.track-past-menu-wrap')) closePastOrderMenus();
    if (event.target.closest('[data-layer="browsemenu-button"]')) {
      window.location.href = 'menu.html';
      return;
    }

    if (event.target.closest('[data-layer="nav-search"]')) {
      window.location.href = 'menu.html';
      return;
    }

    if (event.target.closest('[data-layer="nav-cart"]')) {
      window.location.href = 'cart.html';
      return;
    }

    const trackBtn = event.target.closest('[data-layer="track order-button"]');
    if (trackBtn) {
      const id = trackBtn.getAttribute('data-order-id');
      const selected = getOrders().find(order => getOrderId(order) === id) || getOrders()[0];
      localStorage.setItem('cbe_track_selected_order', JSON.stringify(selected || {}));
      window.location.href = `track-fullscreen.html?orderId=${encodeURIComponent(getOrderId(selected || {}))}`;
    }
  }, true);

  window.renderTrack = render;
  window.renderOrders = render;

  window.addEventListener('storage', function(event) {
    if (TRACK_ORDER_KEYS.includes(event.key)) render();
  });

  render();

  let lastSnapshot = '';
  setInterval(function() {
    const snapshot = TRACK_ORDER_KEYS
      .map(key => localStorage.getItem(key) || '')
      .join('|');

    if (snapshot !== lastSnapshot) {
      lastSnapshot = snapshot;
      render();
    }
  }, 1500);
})();
</script>

<script>
(function syncTrackCustomerOrdersFromFirebase() {
  function clean(value) {
    return value === null || value === undefined ? "" : String(value).trim();
  }

  function parseJSON(value, fallback) {
    try {
      return value ? JSON.parse(value) : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function phone10(value) {
    const digits = clean(value).replace(/\D/g, "");
    return digits.length > 10 ? digits.slice(-10) : digits;
  }

  function timestampToISO(value) {
    if (!value) return "";
    if (typeof value.toDate === "function") return value.toDate().toISOString();
    if (value.seconds) return new Date(value.seconds * 1000).toISOString();
    if (typeof value === "string") return value;
    return "";
  }

  function getLocalProfile() {
    const keys = [
      "TIFFIN_CUSTOMER_PROFILE",
      "CBE_CUSTOMER_PROFILE",
      "customerProfile",
      "cust_profile",
      "userProfile",
      "profile"
    ];

    for (const key of keys) {
      const value = parseJSON(localStorage.getItem(key), null);
      if (value && typeof value === "object" && !Array.isArray(value)) return value;
    }

    return {};
  }

  function getLocalIdentity(user) {
    const profile = getLocalProfile();
    const auth = parseJSON(localStorage.getItem("cust_auth"), {}) || {};

    const uid = clean(
      user?.uid ||
      localStorage.getItem("cust_uid") ||
      localStorage.getItem("customer_uid") ||
      localStorage.getItem("TIFFIN_CUSTOMER_UID") ||
      auth.uid ||
      auth.customerId ||
      profile.uid ||
      profile.customerId ||
      profile.id ||
      ""
    );

    const phone = phone10(
      user?.phoneNumber ||
      localStorage.getItem("cust_phone") ||
      localStorage.getItem("cust_mobile") ||
      localStorage.getItem("customer_phone") ||
      localStorage.getItem("customer_mobile") ||
      localStorage.getItem("TIFFIN_CUSTOMER_PHONE") ||
      localStorage.getItem("mobile") ||
      auth.phone ||
      auth.mobile ||
      auth.phoneNumber ||
      profile.phone ||
      profile.mobile ||
      profile.phoneNumber ||
      ""
    );

    if (uid) localStorage.setItem("cust_uid", uid);
    if (phone) localStorage.setItem("cust_phone", phone);

    return { uid, phone };
  }

  function normalizeOrder(id, data, fallbackCustomer = {}) {
    if (!data || typeof data !== "object") return null;

    const createdAt =
      timestampToISO(data.createdAt) ||
      timestampToISO(data.created_at) ||
      data.createdAtClient ||
      data.createdAt ||
      data.date ||
      "";

    const updatedAt =
      timestampToISO(data.updatedAt) ||
      timestampToISO(data.updated_at) ||
      data.updatedAt ||
      "";

    const deliveredAt =
      timestampToISO(data.deliveredAt) ||
      timestampToISO(data.completedAt) ||
      data.deliveredAt ||
      data.completedAt ||
      "";

    return {
      id: clean(data.id || data.orderId || id),
      ...data,
      customerId: clean(data.customerId || data.customerUID || data.customerUid || data.customer?.uid || fallbackCustomer.uid || ""),
      customerPhone: phone10(data.customerPhone || data.customerMobile || data.phone || data.customer?.phone || fallbackCustomer.phone || ""),
      createdAt,
      updatedAt,
      deliveredAt,
      items: Array.isArray(data.items) ? data.items : Array.isArray(data.cartItems) ? data.cartItems : [],
      total: Number(data.totals?.total ?? data.total ?? data.totalPaid ?? data.amount ?? data.grandTotal ?? 0),
      restaurantName: data.restaurantName || data.storeName || "Coimbatore Foods"
    };
  }

  function getPaymentStatus(order) {
    return clean(order?.paymentStatus || order?.payment?.status || order?.razorpayPaymentStatus || "")
      .toLowerCase()
      .replace(/[\s-]+/g, "_");
  }

  function getAdminStatus(order) {
    return clean(order?.adminStatus || order?.orderStatus || order?.deliveryStatus || order?.riderStatus || order?.status || "")
      .toLowerCase()
      .replace(/[\s-]+/g, "_");
  }

  function isPaymentConfirmed(order) {
    const paymentStatus = getPaymentStatus(order);
    const paymentMethod = clean(order?.paymentMethod || order?.payment?.method || order?.method || "")
      .toLowerCase()
      .replace(/[\s-]+/g, "_");

    const blockedStatus = [
      "checkout_ready",
      "payment_pending",
      "pending_payment",
      "payment_initiated",
      "awaiting_payment",
      "created"
    ];

    const blockedPayment = [
      "pending",
      "unpaid",
      "failed",
      "cancelled",
      "canceled",
      "created"
    ];

    if (blockedStatus.includes(getAdminStatus(order))) return false;
    if (blockedPayment.includes(paymentStatus)) return false;
    if (["paid", "success", "captured", "completed", "payment_success"].includes(paymentStatus)) return true;
    if (order?.paidAt || order?.paymentId || order?.razorpayPaymentId || order?.razorpay_payment_id) return true;
    if (["cod", "cash", "cash_on_delivery"].includes(paymentMethod)) return true;

    return false;
  }

  function saveAndRefreshOrders(orderGroups) {
    const merged = new Map();

    orderGroups.flat().filter(Boolean).forEach(order => {
      if (!isPaymentConfirmed(order)) return;

      const id = clean(order.id || order.orderId || order.paymentId || order.createdAt || JSON.stringify(order).slice(0, 60));
      if (!id) return;

      merged.set(id, {
        ...order,
        id
      });
    });

    const orders = Array.from(merged.values()).sort((a, b) => {
      return new Date(b.createdAt || b.paidAt || 0) - new Date(a.createdAt || a.paidAt || 0);
    });

    try {
      localStorage.setItem("CBE_TRACK_CUSTOMER_ORDERS", JSON.stringify(orders));
    } catch (_) {}

    if (typeof window.renderTrack === "function") window.renderTrack();
    else if (typeof window.renderOrders === "function") window.renderOrders();
  }

  async function loadCustomerDocumentOrders(db, identity) {
    if (!identity.uid) return [];

    try {
      const doc = await db.collection("customers").doc(identity.uid).get();
      if (!doc.exists) return [];

      const data = doc.data() || {};
      const list = []
        .concat(Array.isArray(data.orders) ? data.orders : [])
        .concat(Array.isArray(data.orderHistory) ? data.orderHistory : [])
        .concat(Array.isArray(data.paidOrders) ? data.paidOrders : []);

      return list.map((order, index) => normalizeOrder(order.id || `customer_doc_${index}`, order, identity)).filter(Boolean);
    } catch (error) {
      console.warn("Track customer document order sync failed", error);
      return [];
    }
  }

  function listenQuery(query, normalizer, onUpdate) {
    try {
      return query.onSnapshot(snapshot => {
        onUpdate(snapshot.docs.map(doc => normalizer(doc.id, doc.data())).filter(Boolean));
      }, error => {
        console.warn("Track order query sync failed", error);
      });
    } catch (error) {
      console.warn("Track order query setup failed", error);
      return function noop() {};
    }
  }

  function boot() {
    if (!window.firebase || !window.TIFFIN_FIREBASE_CONFIG || !window.TIFFIN_FIREBASE_CONFIG.apiKey) {
      if (typeof window.renderTrack === "function") window.renderTrack();
      return;
    }

    try {
      if (!firebase.apps.length) firebase.initializeApp(window.TIFFIN_FIREBASE_CONFIG);

      const auth = firebase.auth();
      const db = firebase.firestore();

      let unsubscribers = [];

      function clearListeners() {
        unsubscribers.forEach(unsubscribe => {
          try { unsubscribe(); } catch (_) {}
        });
        unsubscribers = [];
      }

      auth.onAuthStateChanged(async user => {
        clearListeners();

        const identity = getLocalIdentity(user);

        if (!identity.uid && !identity.phone) {
          try { localStorage.setItem("CBE_TRACK_CUSTOMER_ORDERS", "[]"); } catch (_) {}
          if (typeof window.renderTrack === "function") window.renderTrack();
          return;
        }

        let customerDocOrders = await loadCustomerDocumentOrders(db, identity);
        let customerSubcollectionOrders = [];
        let globalUidOrders = [];
        let globalPhoneOrders = [];

        function mergeAndRender() {
          saveAndRefreshOrders([
            customerDocOrders,
            customerSubcollectionOrders,
            globalUidOrders,
            globalPhoneOrders
          ]);
        }

        mergeAndRender();

        if (identity.uid) {
          unsubscribers.push(listenQuery(
            db.collection("customers").doc(identity.uid).collection("orders").limit(50),
            (id, data) => normalizeOrder(id, data, identity),
            orders => {
              customerSubcollectionOrders = orders;
              mergeAndRender();
            }
          ));

          unsubscribers.push(listenQuery(
            db.collection("orders").where("customerId", "==", identity.uid).limit(50),
            (id, data) => normalizeOrder(id, data, identity),
            orders => {
              globalUidOrders = orders;
              mergeAndRender();
            }
          ));
        }

        if (identity.phone) {
          unsubscribers.push(listenQuery(
            db.collection("orders").where("customerPhone", "==", identity.phone).limit(50),
            (id, data) => normalizeOrder(id, data, identity),
            orders => {
              globalPhoneOrders = orders;
              mergeAndRender();
            }
          ));
        }
      });
    } catch (error) {
      console.warn("Track Firebase customer order sync failed", error);
      if (typeof window.renderTrack === "function") window.renderTrack();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>

<script id="cf-mobile-zoom-lock-script">
  (function () {
    if (window.__cfMobileZoomLock) return;
    window.__cfMobileZoomLock = true;

    let lastTouchEnd = 0;

    document.addEventListener(
      "touchend",
      function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      },
      { passive: false }
    );

    document.addEventListener(
      "gesturestart",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );

    document.addEventListener(
      "gesturechange",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );
  })();
