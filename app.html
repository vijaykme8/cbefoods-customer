<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12130F">
<title>Coimbatore Foods</title>
<script>
  // App-shell rollback safety: if any old PWA/session opens app.html, return to stable page flow.
  const hash = (location.hash || '').replace('#','').split('?')[0];
  const target = hash === 'cart' ? 'cart.html' : hash === 'track' ? 'track.html' : hash === 'profile' ? 'profile.html' : 'menu.html';
  location.replace(target);
</script>
</head>
<body></body>
</html>
